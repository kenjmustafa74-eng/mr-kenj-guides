# Builds the static guides and publishes them on GitHub Pages.
# Year Five → https://<user>.github.io/<repo>/year-five/   Year Six → …/year-six/ (once its content exists)
# No answer keys are involved: they live only in Firestore (uploaded from the teacher's computer).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install (no install scripts needed for the static build)
        run: npm ci --ignore-scripts
      - name: Build content and website
        env:
          # Optional: a repository variable holding the Firebase web config as JSON.
          # If it is not set, config/firebase.web.json from the repository is used.
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
        run: npm run build:site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
