cards:
  - front: Who was Helen Keller's teacher?
    back: Anne Sullivan.
  - front: How did Helen's teacher teach her words?
    back: She spelt the words into Helen's hand with her fingers.
  - front: What is the difference between a biography and an autobiography?
    back: A biography is written by someone else. An autobiography is written by the person about their own life.
  - front: What does Bai-Tong's nickname mean?
    back: Banana leaf.
  - front: What is a dacha?
    back: A country house in Russia.
  - front: What is a tense shift?
    back: A change from one tense to another. It should only happen when the time of the action changes.
  - front: "What is the ie/ei spelling rule?"
    back: "'i' before 'e', except after 'c' (believe, receive), but there are exceptions, such as weird and seize."
practice:
  - q: In which person is an autobiography written?
    options: ["First person", "Second person", "Third person", "No person"]
    answer: 0
    explain: The writer tells their own story using I, me and my.
  - q: When was Helen Keller born?
    options: ["1780", "1880", "1950", "2000"]
    answer: 1
    explain: Helen Keller was born in 1880.
  - q: Which word is spelt correctly?
    options: ["recieve", "receive", "receeve", "receve"]
    answer: 1
    explain: "'i' before 'e', except after 'c': receive."
  - q: Which sentence has a correct tense?
    options: ["Yesterday I go to the park.", "Yesterday I went to the park.", "Yesterday I will go to the park.", "Yesterday I am going to the park."]
    answer: 1
    explain: "'Yesterday' tells us to use the past tense."
  - q: Which is the best synonym for 'happy' in 'a happy, peaceful life'?
    options: ["contented", "ecstatic", "lucky", "hilarious"]
    answer: 0
    explain: "'Contented' suits a calm, peaceful kind of happiness."
  - q: Which word comes from Italian?
    options: ["pizza", "tapas", "roti", "ketchup"]
    answer: 0
    explain: Pizza is an Italian word.
  - q: What did Helen suddenly understand at the water pump?
    options: ["That every thing has a name", "How to swim", "How to cook", "How to see"]
    answer: 0
    explain: She realised that the letters spelt into her hand were the name of the water.
  - q: What is a feature of an autobiographical essay?
    options: ["It is written in the third person", "It has a strong opening and a friendly style", "It has stage directions", "It rhymes"]
    answer: 1
    explain: Autobiographical essays are short, friendly and in the first person.
