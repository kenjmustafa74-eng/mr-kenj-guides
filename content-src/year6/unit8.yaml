id: 8
title: Life Stories
colour: "#a8482f"
sbStart: 178
wbStart: 120
sbPages: "178–202"
wbPages: "120–136"
parts:
  - code: 8A
    title: Bravery and Hope
  - code: 8B
    title: Everyday Lives
overview: >-
  Everyone has a story to tell, including you! In this unit you will read part of Helen Keller's autobiography, in which
  she describes the day her teacher arrived and the moment she understood that everything has a name. Then you will meet
  two young people who describe their everyday lives in Thailand and Russia. You will learn the features of
  autobiographies, how to use verb tenses and shift between them correctly, and you will write an autobiographical
  essay about yourself.
objectives:
  - Identify the features of autobiographies and autobiographical essays.
  - Identify verb tenses and explain why a writer uses them.
  - Shift between tenses correctly and only when the meaning needs it.
  - Choose the best synonym for the context.
  - Spell words with ie and ei.
  - Explore word origins and how words are borrowed from other languages.
  - Interview a classmate, and write a paragraph in an autobiography and an autobiographical essay.
texts:
  - title: The Story of My Life
    kind: Autobiography by Helen Keller
    pages: "181–187"
    summary: >-
      Helen Keller was born in 1880 and lost her sight and hearing as a small child. In this part of her autobiography,
      she remembers the day her teacher, Anne Sullivan, arrived, just before Helen turned seven. Her teacher spelt words
      into her hand, and one day Helen understood that every thing has a name. Learning words opened up the world to her
      and filled her with hope and joy.
  - title: Growing Up in Thailand
    kind: Autobiographical essay
    pages: "192–193"
    summary: >-
      A thirteen-year-old boy from Thailand, whose nickname Bai-Tong means 'banana leaf', introduces himself, his
      family and his school. He enjoys tennis, basketball and the piano, and maths is his favourite subject because he
      likes solving problems.
  - title: Beautiful St Petersburg
    kind: Autobiographical essay
    pages: "195–197"
    summary: >-
      Ilya, who is also thirteen, describes life in the Russian city of St Petersburg, with its historic buildings and
      light summer nights. He writes about his family, his school, his friends and holidays at his grandmother's country
      house, called a dacha.
vocab:
  - word: autobiography
    meaning: The story of a person's life, written by that person.
    example: Helen Keller wrote her autobiography in the first person.
  - word: autobiographical essay
    meaning: A short piece of writing about part of your own life.
    example: My autobiographical essay is about my family and my hobbies.
  - word: first person
    meaning: Writing from the writer's own point of view, using I, me, my and we.
    example: "'I was born in 1880' is written in the first person."
  - word: Braille
    meaning: A system of raised dots that blind people read by touch.
    example: She read the Braille book with her fingertips.
  - word: anticipate
    meaning: To expect something to happen.
    example: Helen anticipated something important that day.
  - word: abstract
    meaning: Something you cannot see or touch, such as love or an idea.
    example: Love is an abstract idea.
  - word: tense
    meaning: The form of a verb that shows when something happens (past, present or future).
    example: "'Walked' is in the past tense."
  - word: tense shift
    meaning: A change from one tense to another in a piece of writing.
    example: A tense shift must have a good reason.
  - word: derivation
    meaning: Where a word comes from and how it was formed.
    example: The derivation of 'pizza' is Italian.
  - word: dacha
    meaning: A country house in Russia.
    example: Ilya spends holidays at his grandmother's dacha.
