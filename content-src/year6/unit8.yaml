grammar:
  - title: Verb tenses
    lesson: "Lesson 4 · Language Focus – Grammar"
    pages: "184"
    wb: "121"
    intro: >-
      Tenses are the clock inside every sentence. When you write about your life, you will travel between the past,
      the present and the future, so let's make sure you always know what time it is!
    points:
      - "The **simple past** describes finished actions: 'She **walked** to the pump.'"
      - "The **past continuous** describes an action in progress in the past: 'I **was drawing** water.'"
      - "The **simple present** describes habits and facts: 'Children **learn** words quickly.'"
      - "The **past perfect** describes an action before another past action: 'I **had learnt** a few words.'"
      - "The **future** can be shown with **will** or **going to**: 'I **will be** an engineer.'"
    examples:
      - text: "My teacher **arrived** in March."
        note: "Simple past: a finished event."
      - text: "I **was stringing** beads when she came in."
        note: "Past continuous: an action in progress."
      - text: "I **live** in Bangkok and I **play** tennis."
        note: "Simple present: facts and habits."
    tip: "Autobiographies mostly use the past tense, but present facts about your life now are in the present tense."
    practice:
      - q: "Which tense is 'was drawing'?"
        options: ["simple past", "past continuous", "simple present", "future"]
        answer: 1
        explain: "was + -ing form = past continuous."
      - q: "Which tense is 'Children learn words quickly'?"
        options: ["simple present", "simple past", "past perfect", "future"]
        answer: 0
        explain: "It states a general fact, so it is in the simple present."
      - q: "Choose the simple past: 'Helen ___ the word in her hand.'"
        options: ["feel", "felt", "feeling", "will feel"]
        answer: 1
        explain: "'Felt' is the simple past of 'feel'."
      - q: "Which sentence is in the past perfect?"
        options: ["I learn many words.", "I had learnt many words.", "I am learning many words.", "I will learn many words."]
        answer: 1
        explain: "had + past participle = past perfect."
      - q: "Which sentence talks about the future?"
        options: ["I was a pianist.", "I am going to be a pianist.", "I have been a pianist.", "I play the piano."]
        answer: 1
        explain: "'going to' shows the future."
  - title: Verb tense shifts
    lesson: "Lesson 12 · Language Focus"
    pages: "194"
    wb: "128"
    intro: >-
      Imagine a story that keeps jumping between yesterday and today for no reason. Confusing! Good writers only change
      tense when the time really changes, and you are about to become one of them.
    points:
      - "Keep to **one main tense** in a paragraph unless the time of the action changes."
      - "An **unnecessary tense shift** is a mistake: 'I **went** home and **eat** dinner.' ✗"
      - "A **correct tense shift** has a reason: 'My name **means** \"little bee\" because my father **was** a beekeeper.'"
      - "Facts that are still true use the **present tense**, even in a past-tense paragraph."
    examples:
      - text: "I returned the book and the librarian **was** happy."
        note: "Both verbs stay in the past."
      - text: "My parents named me Xoli, which **means** 'one who forgives'."
        note: "Correct shift: the meaning is still true today."
      - text: "Yesterday I did my homework and then I **went** out."
        note: "'Yesterday' keeps both actions in the past."
    tip: "Read your paragraph and underline each verb. Is every change of tense for a good reason?"
    practice:
      - q: "Which sentence has an unnecessary tense shift?"
        options: ["I walked home and ate dinner.", "I walked home and eat dinner.", "I walk home and eat dinner.", "I will walk home and eat dinner."]
        answer: 1
        explain: "'walked' is past but 'eat' is present, with no reason to change."
      - q: "Correct the sentence: 'She sprained her ankle and we help her.'"
        options: ["She sprains her ankle and we helped her.", "She sprained her ankle and we helped her.", "She sprained her ankle and we will help her.", "She spraining her ankle and we help her."]
        answer: 1
        explain: "Both actions happened in the past."
      - q: "Why is this shift correct? 'Ilya visited Moscow, which is the capital of Russia.'"
        options: ["It is a mistake", "Moscow is still the capital today", "Ilya lives in the future", "It is a question"]
        answer: 1
        explain: "A fact that is still true uses the present tense."
      - q: "Choose the correct verb: 'Last summer we ___ to my grandmother's dacha.'"
        options: ["go", "goes", "went", "will go"]
        answer: 2
        explain: "'Last summer' needs the past tense."
      - q: "Choose the correct verb: 'I am excited because my brother ___ home today.'"
        options: ["came", "is coming", "had come", "come"]
        answer: 1
        explain: "The sentence is about now and today, so we use 'is coming'."
