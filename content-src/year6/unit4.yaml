cards:
  - front: What is the difference between a biography and an autobiography?
    back: A biography is written by someone else. An autobiography is written by the person themselves.
  - front: Why is Murasaki Shikibu famous?
    back: She wrote The Tale of Genji, often called the world's first novel.
  - front: How did Katherine Johnson help space travel?
    back: Her calculations helped to plot the flight paths of spacecraft, including missions to the Moon.
  - front: Name two of Benjamin Franklin's inventions.
    back: The lightning rod, swim fins, a library chair and an extension arm (any two).
  - front: What is the difference between a homograph and a homophone?
    back: Homographs are spelt the same. Homophones sound the same but are spelt differently.
  - front: Give an example of a connective for emphasis.
    back: "'Not only … but also', 'neither … nor' or 'no sooner … than'."
  - front: Which person and tense are biographies usually written in?
    back: The third person and the past tense.
practice:
  - q: In what order are events in a biography usually told?
    options: ["Random order", "Alphabetical order", "Chronological order", "Reverse order"]
    answer: 2
    explain: Biographies usually tell events in the order they happened.
  - q: Which pair are homophones?
    options: ["whale / wail", "wind / wind", "read / reading", "rose / roses"]
    answer: 0
    explain: "'whale' and 'wail' sound the same but are spelt differently."
  - q: What did Murasaki Shikibu learn as a child that was unusual for girls at the time?
    options: ["To sail", "To write Chinese", "To paint", "To ride horses"]
    answer: 1
    explain: Only men usually learnt to write Chinese, the official language at the time.
  - q: Why was Katherine Johnson's work important?
    options: ["She designed rockets' paint", "Her calculations helped plot spacecraft flight paths", "She was an astronaut", "She built computers"]
    answer: 1
    explain: Her calculations helped American spacecraft reach their targets safely.
  - q: Which sentence uses a connective for emphasis?
    options: ["Ben read books.", "Ben not only read books but also wrote articles.", "Ben read books and slept.", "Ben was born in Boston."]
    answer: 1
    explain: "'not only … but also' adds emphasis."
  - q: Which is an adverbial phrase of time?
    options: ["in the print shop", "very carefully", "at the age of 17", "with great skill"]
    answer: 2
    explain: "'at the age of 17' tells us when."
  - q: What lesson did young Ben learn from building the wharf?
    options: ["Nothing dishonest is truly useful", "Always build near water", "Work alone", "Never read books"]
    answer: 0
    explain: His father taught him that nothing is useful if it is not honest.
  - q: Why might a writer use a very short sentence?
    options: ["To confuse the reader", "To add impact or drama", "To make a list", "To ask a question"]
    answer: 1
    explain: A short sentence can give a strong, dramatic effect.
basket:
  - prompt: Catch the features of a biography
    correct: [third person, past tense, chronological order, dates, headings, facts, quotations, introduction]
    wrong: [rhyme, chorus, stage directions, punchline, verse, spells, talking animals, rhythm]
  - prompt: Catch Benjamin Franklin's inventions
    correct: [lightning rod, swim fins, library chair, extension arm, Franklin stove, bifocal glasses]
    wrong: [telephone, light bulb, aeroplane, television, computer, bicycle, camera, radio]
  - prompt: Catch the adverbials of time
    correct: [as a boy, later, in 1790, when he was 17, one day, after school, at last, years later]
    wrong: [in the river, carefully, under the table, near Boston, quietly, at the shop, with a smile, over the wall]
grammar:
  - title: Using sentences for different effects
    lesson: "Lesson 4 · Language Focus – Grammar"
    pages: "82"
    wb: "53–54"
    intro: >-
      Writing is a bit like music. If every note is the same length, it becomes dull. When you mix short and long
      sentences, your writing has rhythm, and your reader stays with you all the way.
    points:
      - "**Short sentences** create impact, drama or tension: 'She did it.'"
      - "**Long sentences** (compound or complex) add detail and explain ideas."
      - "Joining short sentences with **conjunctions** or **relative clauses** helps writing to flow."
      - "Varying sentence length changes the **pace** and keeps the reader interested."
    examples:
      - text: "The calculations were checked again and again, because one tiny mistake could put the astronauts in danger. They were perfect."
        note: "A long sentence explains; the short one adds impact."
      - text: "The numbers were checked. Then they were checked again. Nothing could go wrong."
        note: "Short sentences build tension and emphasis."
      - text: "Franklin, who loved books, built a chair that turned into steps."
        note: "A relative clause joins two ideas smoothly."
    tip: "Read your work aloud. If it sounds choppy, join some sentences. If it sounds breathless, split some up."
    practice:
      - q: "What effect does a very short sentence usually have?"
        options: ["It adds impact or drama", "It explains a process in detail", "It makes a list", "It always asks a question"]
        answer: 0
        explain: "Short sentences stand out and create drama."
      - q: "Which is the best way to join these? 'Ben loved books. He built a library chair.'"
        options: ["Ben loved books he built a library chair.", "Because Ben loved books, he built a library chair.", "Ben loved books, he built a library chair.", "Ben. loved books built a library chair."]
        answer: 1
        explain: "A subordinate clause with 'because' joins the ideas correctly."
      - q: "Why do writers vary sentence length?"
        options: ["To change the pace and keep readers interested", "To use fewer words", "To avoid full stops", "To make writing harder to read"]
        answer: 0
        explain: "Varied sentences give writing rhythm and pace."
      - q: "Which sentence is a long complex sentence?"
        options: ["She smiled.", "The rocket launched.", "When the numbers were finally checked, the team knew the mission was safe.", "It worked."]
        answer: 2
        explain: "It has a subordinate clause and a main clause, so it is complex."
      - q: "Which would make the most dramatic ending to a paragraph?"
        options: ["Then, after a while, everything carried on as normal.", "Silence.", "They went home later that evening after the meeting.", "It was quite a long day for everyone."]
        answer: 1
        explain: "A one-word sentence can create a powerful, dramatic ending."
  - title: Subordinate clauses and connectives for emphasis
    lesson: "Lesson 12 · Language Focus"
    pages: "93–94"
    wb: "61"
    intro: >-
      Want your reader to notice something important? Subordinate clauses add detail, and special connectives put a
      spotlight on your ideas. Let's add some power to your sentences!
    points:
      - "A **subordinate clause** adds information to a main clause and cannot stand alone."
      - "Subordinate clauses can begin with words such as **although**, **while**, **when**, **before** and **because**."
      - "**Connectives for emphasis** make a point stronger: **not only … but also**, **neither … nor**, **no sooner … than**, **especially**, **particularly**."
      - "When a sentence starts with 'Not only', the order of the words changes: 'Not only **did he** read, but he also wrote.'"
    examples:
      - text: "Although he left school at the age of ten, Ben never stopped learning."
        note: "The subordinate clause comes first, followed by a comma."
      - text: "Ben was **not only** a printer **but also** an inventor."
        note: "The connective emphasises both roles."
      - text: "**No sooner** had he finished one book **than** he started another."
        note: "This shows that something happened straight after something else."
    tip: "Use connectives for emphasis carefully. One or two in a paragraph is plenty."
    practice:
      - q: "Which is the subordinate clause? 'While he worked in the shop, Ben read every night.'"
        options: ["Ben read every night", "While he worked in the shop", "every night", "Ben read"]
        answer: 1
        explain: "'While he worked in the shop' cannot stand alone."
      - q: "Complete the connective: 'Neither Ben ___ his friends thought it was wrong.'"
        options: ["or", "but", "nor", "and"]
        answer: 2
        explain: "'Neither' is paired with 'nor'."
      - q: "Complete: 'Not only did she solve the problem, ___ she also explained it.'"
        options: ["but", "so", "or", "because"]
        answer: 0
        explain: "'Not only' is paired with 'but also'."
      - q: "Which sentence is correct?"
        options: ["No sooner had the storm started than the lights went out.", "No sooner the storm started than the lights went out.", "No sooner had the storm started when the lights went out.", "No sooner had the storm started but the lights went out."]
        answer: 0
        explain: "We say 'No sooner had … than …'."
      - q: "Which word adds emphasis? 'Ben loved swimming, ___ in the river.'"
        options: ["especially", "although", "because", "unless"]
        answer: 0
        explain: "'especially' emphasises where he loved swimming most."
  - title: Adverbs and adverbial phrases of time
    lesson: "Lesson 14 · Language Focus – Grammar"
    pages: "97"
    wb: "64"
    intro: >-
      A biography is a journey through someone's life. Adverbials of time are the signposts that show your reader
      where they are on that journey.
    points:
      - "**Adverbs of time** tell us when: later, soon, then, finally, afterwards."
      - "**Adverbial phrases of time** do the same job with more words: 'as a boy', 'in 1790', 'two centuries later', 'when he was 17'."
      - "They are often used at the start of a sentence (a **fronted adverbial**), followed by a comma."
      - "They help to keep events in **chronological order**."
    examples:
      - text: "**As a boy,** Franklin loved to swim."
        note: "A fronted adverbial phrase of time, followed by a comma."
      - text: "**Later,** he moved to Philadelphia."
        note: "A single adverb of time."
      - text: "She retired from NASA **in 1986**."
        note: "The adverbial can also come at the end."
    tip: "Do not start every sentence the same way. Vary your adverbials: 'Soon', 'Years later', 'By then'."
    practice:
      - q: "Which is an adverbial phrase of time?"
        options: ["in the garden", "two years later", "very quickly", "under the bridge"]
        answer: 1
        explain: "'two years later' tells us when."
      - q: "Which sentence is punctuated correctly?"
        options: ["In 1706 Benjamin was born.", "In 1706, Benjamin was born.", "In, 1706 Benjamin was born.", "In 1706 Benjamin, was born."]
        answer: 1
        explain: "Put a comma after a fronted adverbial."
      - q: "Which word is an adverb of time?"
        options: ["afterwards", "carefully", "here", "loudly"]
        answer: 0
        explain: "'afterwards' tells us when."
      - q: "Why are adverbials of time useful in a biography?"
        options: ["They show the order of events", "They describe colours", "They replace nouns", "They make questions"]
        answer: 0
        explain: "They help to keep events in chronological order."
      - q: "Find the adverbial of time: 'When she was ten, Katherine started high school.'"
        options: ["Katherine started", "high school", "When she was ten", "started high school"]
        answer: 2
        explain: "'When she was ten' tells us when it happened."
