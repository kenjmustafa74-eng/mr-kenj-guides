id: 4
title: Innovators and Inventors
colour: "#9a5b13"
sbStart: 77
wbStart: 52
sbPages: "77–101"
wbPages: "52–68"
parts:
  - code: 4A
    title: Innovators
  - code: 4B
    title: Inventors
overview: >-
  What does it take to change the world? In this unit you will meet remarkable people who did just that: a writer at the
  Japanese imperial court more than a thousand years ago, a brilliant mathematician who helped astronauts reach the Moon,
  and an American inventor who was also a printer, a writer and a statesman. You will learn how biographies are
  organised, how to use sentences for different effects, and then you will write a biography of your own.
objectives:
  - Explain the structure and features of a biography, including chronological order and the third person.
  - Use short, long, compound and complex sentences for different effects.
  - Use context clues to work out the meanings of unfamiliar words.
  - Tell the difference between homographs and homophones.
  - Use subordinate clauses and connectives for emphasis, such as 'not only … but also'.
  - Use adverbs and adverbial phrases of time to show when events happened.
  - Listen to a talk about an inventor, then plan and write a biography.
texts:
  - title: Murasaki Shikibu – Life at the Imperial Court
    kind: Biography
    pages: "80–81"
    summary: >-
      Murasaki Shikibu was born in Japan in about 978. As a child, she learnt to write Chinese, which only men were
      usually taught at the time. She served at the imperial court, and her experiences there helped her to write The
      Tale of Genji, which is often called the world's first novel.
  - title: Katherine Johnson – Racing to the Moon
    kind: Biography
    pages: "83–86"
    summary: >-
      Katherine Johnson was born in 1918 and showed a gift for numbers from an early age. She grew up in a segregated
      society with few schools for black children, but she became a brilliant mathematician. Her calculations helped to
      plot the flight paths of American spacecraft, including missions to the Moon.
  - title: Benjamin Franklin – Statesman, Businessman and Inventor
    kind: Biography
    pages: "91–96"
    summary: >-
      Benjamin Franklin was born in Boston in 1706 into a large family. He worked in his father's candle and soap
      business and then in his brother's print shop, reading every book he could. He learnt that nothing dishonest is
      truly useful. He invented the lightning rod, swim fins, a library chair and an extension arm, and he helped to
      draft the Declaration of Independence. He believed inventions should be shared freely.
  - title: Elon Musk's Amazing Inventions
    kind: Listening text
    pages: "98"
    summary: >-
      A talk about the life and ideas of a modern inventor and businessman who was born in South Africa and who looks
      for new ways to solve problems.
vocab:
  - word: biography
    meaning: The true story of a person's life, written by someone else.
    example: I read a biography of a famous scientist.
  - word: autobiography
    meaning: The story of a person's life, written by that person.
    example: Franklin wrote his autobiography for his son.
  - word: chronological order
    meaning: The order in which events happened, from first to last.
    example: A timeline shows events in chronological order.
  - word: innovator
    meaning: A person who introduces new ideas or new ways of doing things.
    example: She was an innovator who changed the way we travel.
  - word: imperial
    meaning: To do with an empire or an emperor.
    example: Murasaki served at the imperial court.
  - word: segregated
    meaning: Kept apart because of race or another group difference.
    example: Katherine Johnson grew up in a segregated society.
  - word: calculation
    meaning: Working out an answer using mathematics.
    example: Her calculations had to be exactly right.
  - word: homograph
    meaning: A word spelt the same as another word but with a different meaning, and sometimes a different sound.
    example: "'Wind' (moving air) and 'wind' (to turn) are homographs."
  - word: homophone
    meaning: A word that sounds the same as another word but has a different spelling and meaning.
    example: "'Whale' and 'wail' are homophones."
  - word: context clues
    meaning: The words and sentences around a new word that help you to work out its meaning.
    example: I used context clues to understand 'abundant'.
