id: 1
title: Time and Space
colour: "#3b4a8c"
sbStart: 1
wbStart: 1
sbPages: "1–26"
wbPages: "1–17"
parts:
  - code: 1A
    title: Time Travel
  - code: 1B
    title: Space Travel
overview: >-
  Welcome to Year 6! We begin with a journey through time and space. You will read two science fiction stories:
  one about a boy who meets his older self, and one about a girl sailing a solar yacht home from the Moon all on her own.
  You will learn how science fiction stories are built, how to use clauses and punctuation like a confident writer,
  and then you will invent a science fiction story of your own.
objectives:
  - Explain the structure of a science fiction story (exposition, rising action, climax, falling action and resolution) and its typical features.
  - Recognise simple, compound and complex sentences, and main and subordinate clauses.
  - Use parenthesis with brackets, commas and dashes to add extra information.
  - Use colons, semi-colons and ellipses correctly and for effect.
  - Spell words with the different spellings of the /k/ sound.
  - Listen to a science fiction story and answer questions about it.
  - Plan, draft and improve your own science fiction story.
texts:
  - title: Time Travel
    kind: Science fiction story by Jenny Hogan
    pages: "4–10"
    summary: >-
      The narrator is a careful boy who lives by three rules, and one of them is never to have anything to do with
      time travel. Then he is pulled forward in time into his own bedroom, where he meets his older self. His older
      self needs him to win the school science fair, because winning leads to a science scholarship, and that is how
      time travel will one day be invented. After an accident, the narrator has to rebuild his volcano project, and an
      unexpected trip far back into the past adds to the adventure.
  - title: Solo Solar Sailing
    kind: Science fiction story by Zareh MacPherson
    pages: "16–20"
    summary: >-
      A young girl is sailing her solar yacht, the Helios, home from the Moon on her own, the youngest girl ever to try.
      Written as a series of log entries, the story follows her as alarms warn of a huge solar flare. She must adjust
      the solar sail and the ion tiller to stay on course for Earth, remembering her father's advice that solar sailing
      is more an art than a science.
  - title: Galileo!
    kind: Listening text (science fiction)
    pages: "23"
    summary: >-
      Stella seems to be at school, but her school is in virtual reality. When she switches it off, we discover that she
      is really aboard her mother's spaceship, exploring the galaxy, and that a wormhole is causing trouble.
vocab:
  - word: science fiction
    meaning: Stories about imagined future science and technology, such as time travel, space travel or robots.
    example: My favourite science fiction story is set on a space station orbiting Mars.
  - word: exposition
    meaning: The beginning of a story, which introduces the characters, the setting and the problem.
    example: In the exposition, we meet the narrator and learn his three rules.
  - word: parallel universe
    meaning: An imagined universe that exists alongside ours but never meets it.
    example: In a parallel universe, perhaps you are reading this on the Moon.
  - word: theory
    meaning: An idea that tries to explain something but has not yet been proved.
    example: Her theory was that the plant grew faster in music.
  - word: trajectory
    meaning: The path an object follows as it moves through the air or space.
    example: The engineers checked the rocket's trajectory carefully.
  - word: solar flare
    meaning: A sudden, powerful burst of energy from the surface of the Sun.
    example: The solar flare set off every alarm on the yacht.
  - word: parenthesis
    meaning: Extra information added to a sentence using brackets, commas or dashes.
    example: My cousin (the one who loves astronomy) visited the planetarium.
  - word: subordinate clause
    meaning: A clause that adds information to a main clause but does not make sense on its own.
    example: Although the sail was damaged, the yacht kept moving.
  - word: semi-colon
    meaning: A punctuation mark (;) that joins two closely linked main clauses.
    example: The alarm rang; the solar flare had arrived.
  - word: independent
    meaning: Able to do things for yourself without relying on others.
    example: She was independent enough to sail home alone.
