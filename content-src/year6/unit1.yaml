cards:
  - front: What are the five parts of a story's plot?
    back: Exposition, rising action, climax, falling action and resolution.
  - front: What makes a story science fiction?
    back: It is set in an imagined future or another world and includes imagined science or technology, such as time travel or spaceships.
  - front: Why does the older self need the narrator to win the science fair?
    back: Winning leads to a science scholarship, and that is how the narrator will grow up to invent time travel.
  - front: What is parenthesis?
    back: Extra information added to a sentence with brackets, commas or dashes. The sentence still makes sense without it.
  - front: What does the narrator of 'Solo Solar Sailing' have to do when the solar flare arrives?
    back: She adjusts the solar sail and the ion tiller so that the Helios stays on course for Earth.
  - front: What is the difference between a colon and a semi-colon?
    back: A colon introduces something, such as a list or an explanation. A semi-colon joins two closely linked main clauses.
  - front: What is a subordinate clause?
    back: A clause that adds information to the main clause but does not make sense on its own.
practice:
  - q: Which part of a plot introduces the characters, setting and problem?
    options: ["The climax", "The exposition", "The falling action", "The resolution"]
    answer: 1
    explain: The exposition is the beginning of the story, where we meet the characters and the setting.
  - q: Which sentence is compound?
    options: ["The alarm rang.", "The alarm rang and the narrator woke up.", "When the alarm rang, the narrator woke up.", "The loud alarm."]
    answer: 1
    explain: It joins two main clauses with 'and', so it is compound.
  - q: Which sentence uses parenthesis correctly?
    options: ["My sister (who loves space) watched the launch.", "My sister who (loves space watched) the launch.", "(My sister) who loves space watched the launch.", "My sister who loves space (watched the launch."]
    answer: 0
    explain: The brackets go around the extra information, 'who loves space'.
  - q: Why does the narrator of 'Time Travel' have a rule about never time travelling?
    options: ["He thinks it is boring", "He is worried that changing the past could change the future", "His teacher told him to", "He does not like science"]
    answer: 1
    explain: He is scared that changing even a small detail in the past could affect the future.
  - q: Which word spells the /k/ sound with 'que'?
    options: ["kitten", "unique", "chorus", "pocket"]
    answer: 1
    explain: In 'unique', the /k/ sound at the end is spelt 'que'.
  - q: "Where should the semi-colon go? 'The sail was damaged the yacht drifted towards Mars.'"
    options: ["The sail; was damaged the yacht drifted towards Mars.", "The sail was damaged; the yacht drifted towards Mars.", "The sail was damaged the yacht; drifted towards Mars.", "The sail was damaged the yacht drifted; towards Mars."]
    answer: 1
    explain: The semi-colon joins the two linked main clauses.
  - q: What is an ellipsis often used for in a story?
    options: ["To end every sentence", "To build suspense", "To start a list", "To show a question"]
    answer: 1
    explain: An ellipsis (…) makes the reader pause and wonder what will happen next.
  - q: How is 'Solo Solar Sailing' told?
    options: ["As a play script", "As a series of log entries", "As a poem", "As a news report"]
    answer: 1
    explain: The narrator records her journey in log entries, like a ship's log.
