grammar:
  - title: Simple, compound and complex sentences
    lesson: "Lesson 4 · Language Focus – Grammar"
    pages: "7"
    wb: "2"
    intro: >-
      Good writers mix their sentences like a chef mixes flavours. Short ones create drama; longer ones explain and
      describe. In Year 6, you will choose your sentence type on purpose, so let's make sure you know all three.
    points:
      - "A **simple sentence** has one main clause: 'The time machine hummed.'"
      - "A **compound sentence** joins two main clauses with a coordinating conjunction such as **and**, **but**, **or** or **so**."
      - "A **complex sentence** has a main clause and at least one **subordinate clause**, often starting with **because**, **when**, **if**, **although** or **while**."
      - "Each main clause in a compound sentence makes sense on its own. A subordinate clause does not."
    examples:
      - text: "The volcano exploded."
        note: "Simple: one main clause."
      - text: "The volcano exploded, so I had to build another one."
        note: "Compound: two main clauses joined by 'so'."
      - text: "Because the volcano exploded, I had to build another one."
        note: "Complex: the subordinate clause starts with 'because'."
    tip: "Ask yourself: can each part stand on its own as a sentence? If both can, it is compound. If one cannot, it is complex."
    practice:
      - q: "Which sentence is simple?"
        options: ["The rocket launched at dawn.", "The rocket launched and the crowd cheered.", "When the rocket launched, the crowd cheered.", "The rocket launched, but the crowd was silent."]
        answer: 0
        explain: "'The rocket launched at dawn.' has only one main clause."
      - q: "Which sentence is compound?"
        options: ["Although it was late, we watched the stars.", "We watched the stars.", "We watched the stars, but the clouds soon covered them.", "Because it was clear, we watched the stars."]
        answer: 2
        explain: "Two main clauses are joined by 'but', so the sentence is compound."
      - q: "Which sentence is complex?"
        options: ["I opened the door and walked in.", "I opened the door when I heard a strange humming.", "I opened the door.", "I opened the door, so the cat ran out."]
        answer: 1
        explain: "'when I heard a strange humming' is a subordinate clause, so the sentence is complex."
      - q: "Which word would turn 'The alarm rang. We woke up.' into a complex sentence?"
        options: ["and", "but", "so", "When"]
        answer: 3
        explain: "'When the alarm rang, we woke up.' 'When' starts a subordinate clause."
      - q: "What type of sentence is this? 'You can travel to the past, or you can visit the future.'"
        options: ["simple", "compound", "complex", "not a sentence"]
        answer: 1
        explain: "Two main clauses are joined by 'or', so it is compound."
  - title: Parenthesis
    lesson: "Lesson 7 · Language Focus – Punctuation"
    pages: "11"
    wb: "5–6"
    intro: >-
      Sometimes you want to whisper a little extra detail to your reader in the middle of a sentence. That is what
      parenthesis does! It adds information without breaking the sentence.
    points:
      - "**Parenthesis** is a word, phrase or clause added to a sentence to give extra information."
      - "You can mark it with a pair of **brackets** ( ), a pair of **commas** or a pair of **dashes** (–)."
      - "Dashes make the extra information stand out more; brackets make it quieter."
      - "If you take the parenthesis away, the sentence must still make sense."
    examples:
      - text: "My older self (who looked very confident) handed me a note."
        note: "Brackets around the extra information."
      - text: "The science fair, I was sure, would be a disaster."
        note: "A pair of commas."
      - text: "The volcano – my second attempt – finally worked."
        note: "A pair of dashes makes the detail stand out."
    tip: "Parenthesis always comes in pairs, unless it reaches the end of the sentence. Check that you have opened and closed it."
    practice:
      - q: "Which sentence uses brackets for parenthesis correctly?"
        options: ["The comet (a ball of ice and dust) flew past.", "The comet a ball (of ice and dust flew) past.", "(The comet a ball) of ice and dust flew past.", "The comet a ball of ice and dust (flew past)."]
        answer: 0
        explain: "The brackets surround the extra information, 'a ball of ice and dust'."
      - q: "Which words are the parenthesis? 'Mrs Patel, our science teacher, judged the fair.'"
        options: ["Mrs Patel", "our science teacher", "judged the fair", "the fair"]
        answer: 1
        explain: "'our science teacher' is extra information, marked by a pair of commas."
      - q: "Which sentence uses dashes correctly?"
        options: ["The yacht – built in 2070 sailed home.", "The yacht – built in 2070 – sailed home.", "The yacht built – in 2070 – sailed home.", "– The yacht built in 2070 sailed home."]
        answer: 1
        explain: "A pair of dashes goes around the extra information."
      - q: "What happens when you remove the parenthesis from a sentence?"
        options: ["It no longer makes sense", "It still makes sense", "It becomes a question", "It becomes a list"]
        answer: 1
        explain: "Parenthesis is extra information, so the sentence still makes sense without it."
      - q: "Which punctuation can NOT be used to mark parenthesis?"
        options: ["brackets", "commas", "dashes", "question marks"]
        answer: 3
        explain: "Parenthesis is marked with brackets, commas or dashes."
  - title: Main and subordinate clauses
    lesson: "Lesson 12 · Language Focus – Grammar"
    pages: "18"
    wb: "10"
    intro: >-
      Think of the main clause as the captain of the sentence and the subordinate clause as the crew. The crew
      adds useful information, but it cannot sail the ship alone!
    points:
      - "A **main clause** has a subject and a verb and makes sense on its own."
      - "A **subordinate clause** also has a verb, but it depends on the main clause to make sense."
      - "Subordinate clauses often begin with **subordinating conjunctions** (if, until, because, although, unless, since) or **relative pronouns** (who, which, that)."
      - "When a subordinate clause comes first, put a comma after it."
    examples:
      - text: "**I will reach Earth** __if the sail holds__."
        note: "The main clause is in bold; the subordinate clause is underlined."
      - text: "__Unless I change direction__, **I will drift towards Mars**."
        note: "The subordinate clause comes first, so it is followed by a comma."
      - text: "**She checked the instruments**, __which were flashing red__."
        note: "A relative pronoun begins this subordinate clause."
    tip: "Read each clause aloud on its own. The one that sounds unfinished is the subordinate clause."
    practice:
      - q: "Which is the main clause? 'Although the flare was huge, the narrator stayed calm.'"
        options: ["Although the flare was huge", "the narrator stayed calm", "Although the flare", "was huge"]
        answer: 1
        explain: "'the narrator stayed calm' makes sense on its own."
      - q: "Which is the subordinate clause? 'We will wait here until the storm passes.'"
        options: ["We will wait here", "We will wait", "until the storm passes", "wait here until"]
        answer: 2
        explain: "'until the storm passes' cannot stand on its own."
      - q: "Which word often begins a subordinate clause?"
        options: ["unless", "yacht", "and", "quickly"]
        answer: 0
        explain: "'Unless' is a subordinating conjunction."
      - q: "Which sentence is punctuated correctly?"
        options: ["If the alarm rings we must act fast.", "If the alarm rings, we must act fast.", "If, the alarm rings we must act fast.", "If the alarm, rings we must act fast."]
        answer: 1
        explain: "The subordinate clause comes first, so a comma follows it."
      - q: "Which of these is a main clause?"
        options: ["because she was brave", "when the sun rose", "the astronaut smiled", "if we are lucky"]
        answer: 2
        explain: "'the astronaut smiled' has a subject and a verb and makes sense alone."
  - title: Colons, semi-colons and ellipses
    lesson: "Lesson 14 · Language Focus – Punctuation"
    pages: "21–22"
    wb: "12"
    intro: >-
      These three marks are a Year 6 writer's secret tools. Use them well, and your writing will look polished and
      sound exciting. Let's learn what each one does.
    points:
      - "A **colon** (:) introduces something: a list, an explanation or a quotation. The words before it must make a complete sentence."
      - "A **semi-colon** (;) joins two main clauses that are closely linked. Both parts must make sense on their own."
      - "An **ellipsis** (…) shows a pause, builds suspense, or shows that words have been left out."
    examples:
      - text: "I packed three things: a torch, a map and a compass."
        note: "The colon introduces a list."
      - text: "The alarm stopped; the danger had passed."
        note: "The semi-colon joins two linked main clauses."
      - text: "The door creaked open … and then there was silence."
        note: "The ellipsis builds suspense."
    tip: "Test a semi-colon by replacing it with a full stop. If you get two proper sentences, the semi-colon is correct."
    practice:
      - q: "Which sentence uses a colon correctly?"
        options: ["We need: three things.", "We need three things: food, water and fuel.", "We: need three things food, water and fuel.", "We need three: things food, water and fuel."]
        answer: 1
        explain: "The colon comes after a complete sentence and introduces the list."
      - q: "Which sentence uses a semi-colon correctly?"
        options: ["The sun rose; the sky turned gold.", "The sun; rose the sky turned gold.", "The sun rose the; sky turned gold.", "The; sun rose the sky turned gold."]
        answer: 0
        explain: "The semi-colon joins two linked main clauses."
      - q: "What is an ellipsis often used for in a story?"
        options: ["To start a list", "To build suspense", "To join two clauses", "To show possession"]
        answer: 1
        explain: "An ellipsis makes the reader pause and wonder what will happen next."
      - q: "Which mark introduces an explanation? 'There was only one problem _ the engine had stopped.'"
        options: ["a colon", "an apostrophe", "a question mark", "a hyphen"]
        answer: 0
        explain: "A colon introduces the explanation: 'the engine had stopped'."
      - q: "Which of these is an ellipsis?"
        options: [";", ":", "…", "–"]
        answer: 2
        explain: "An ellipsis is three dots."
