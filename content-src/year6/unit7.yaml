cards:
  - front: How does Tom Sawyer get his friends to paint the fence?
    back: He pretends that painting is a special job that only a gifted boy could do, so they beg and pay to have a turn.
  - front: Where did Mary Lennox live before Misselthwaite Manor?
    back: In India.
  - front: How does Mary change in The Secret Garden?
    back: She begins as lonely and cross, but caring for the garden makes her happier and more interested in life.
  - front: What is the past perfect tense?
    back: had + past participle, for example 'she had found'. It shows an action that happened before another past action.
  - front: What is a dialect?
    back: A form of a language spoken in a particular area, like Martha's Yorkshire dialect.
  - front: Give two differences between spoken and written English.
    back: Spoken English often uses contractions, informal words and incomplete sentences. Written English is usually more formal and complete.
  - front: "What does the idiom 'by the skin of my teeth' mean?"
    back: Only just; very narrowly.
practice:
  - q: What does Tom have to do on Saturday?
    options: ["Go swimming", "Whitewash the fence", "Feed the horses", "Go to school"]
    answer: 1
    explain: Aunt Polly makes Tom whitewash the fence.
  - q: "What does the idiom 'let's call it a day' mean?"
    options: ["Let's name the day", "Let's stop working for now", "Let's start early", "Let's phone someone"]
    answer: 1
    explain: It means to stop what you are doing for now.
  - q: Which sentence is in the past perfect tense?
    options: ["Mary finds the key.", "Mary had found the key.", "Mary will find the key.", "Mary is finding the key."]
    answer: 1
    explain: "'had found' is had + past participle."
  - q: Which word has the /j/ sound spelt dge?
    options: ["giant", "jungle", "bridge", "magic"]
    answer: 2
    explain: "In 'bridge', the /j/ sound is spelt dge."
  - q: Which is an example of spoken English?
    options: ["I would rather not.", "I'd rather not, y'know.", "He stated that he would rather not.", "It is preferable not to."]
    answer: 1
    explain: Contractions and fillers such as 'y'know' are features of spoken English.
  - q: What does the narrator's use of 'he' and 'she' tell us?
    options: ["It is a first-person narrator", "It is a third-person narrator", "It is a play", "It is a poem"]
    answer: 1
    explain: A third-person narrator uses he, she and they.
  - q: What has happened to the garden before Mary finds it?
    options: ["It has been looked after every day", "Nobody has looked after it for years", "It has been sold", "It has been built recently"]
    answer: 1
    explain: The garden has been neglected for a long time.
  - q: How is Martha's speech different from Mary's?
    options: ["It is more formal", "She speaks in a Yorkshire dialect", "She only whispers", "She speaks in rhyme"]
    answer: 1
    explain: Martha uses a Yorkshire dialect with informal words and contractions.
