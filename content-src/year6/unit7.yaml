grammar:
  - title: Differences between written and spoken English
    lesson: "Lesson 4 · Language Focus – Grammar"
    pages: "158"
    wb: "104"
    intro: >-
      We do not write the way we talk, and we do not talk the way we write! Clever writers use spoken English in dialogue
      to bring characters to life, and standard written English everywhere else.
    points:
      - "**Spoken English** often uses **contractions** (ain't, don't), **informal words**, **fillers** (well, you know) and **incomplete sentences**."
      - "**Written English** is usually more **formal**, with complete sentences and standard grammar."
      - "Writers use spoken English in **dialogue** to show a character's personality, background and **dialect**."
      - "When you change dialogue into **reported speech**, use standard written English."
    examples:
      - text: "“Hello, old chap, you got to work, hey?”"
        note: "Spoken: informal and friendly."
      - text: "Ben asked Tom whether he had to work."
        note: "Written: formal reported speech."
      - text: "“I'm not going, am I?” → She said that she was not going."
        note: "The contraction and the question tag disappear in written reported speech."
    tip: "Spoken English is not wrong. It just belongs in dialogue, not in formal writing."
    practice:
      - q: "Which is a feature of spoken English?"
        options: ["Complete formal sentences", "Contractions such as 'ain't'", "Headings", "Footnotes"]
        answer: 1
        explain: "Contractions are common in speech."
      - q: "Which sentence is formal written English?"
        options: ["Gonna paint it later.", "I ain't doing it.", "Tom said that he would paint it later.", "Yeah, whatever."]
        answer: 2
        explain: "It is complete and uses standard grammar."
      - q: "Why do writers use spoken English in dialogue?"
        options: ["To show how characters really speak", "To make spelling mistakes", "To shorten the story", "To confuse readers"]
        answer: 0
        explain: "It brings characters and their backgrounds to life."
      - q: "Report this in written English: “Can I try?” asked Ben."
        options: ["Ben asked can he try.", "Ben asked if he could try.", "Ben asked, can I try?", "Ben asked could I try?"]
        answer: 1
        explain: "Use 'if', change 'I' to 'he' and 'can' to 'could'."
      - q: "Which word is a filler often used in speech?"
        options: ["therefore", "well", "however", "consequently"]
        answer: 1
        explain: "'Well' is often used as a filler when people talk."
  - title: Perfect tenses
    lesson: "Lesson 12 · Language Focus"
    pages: "169"
    wb: "111"
    intro: >-
      The perfect tenses are like bridges in time. They link one moment to another. Once you master them, you can show
      your reader exactly how events connect.
    points:
      - "The **present perfect** (has/have + past participle) links the past to now: 'I **have read** this book.'"
      - "The **past perfect** (had + past participle) shows an action that happened **before** another past action: 'The roses **had spread** before Mary arrived.'"
      - "The **future perfect** (will have + past participle) shows that something will be finished by a time in the future: 'By spring, we **will have planted** seeds.'"
      - "Learn irregular past participles: seen, flown, grown, written, done."
    examples:
      - text: "Mary **has found** a secret garden."
        note: "Present perfect: the finding is linked to now."
      - text: "Nobody **had opened** the door for ten years."
        note: "Past perfect: before Mary came."
      - text: "By summer, the roses **will have bloomed**."
        note: "Future perfect: finished by a future time."
    tip: "Look for has/have, had or will have. Then check that the verb after it is a past participle."
    practice:
      - q: "Which is the present perfect?"
        options: ["She found", "She has found", "She had found", "She will find"]
        answer: 1
        explain: "has + past participle."
      - q: "Complete with the past perfect: 'The robin ___ to the wall before Mary saw it.'"
        options: ["flies", "has flown", "had flown", "will fly"]
        answer: 2
        explain: "The flying happened before the seeing, so we use 'had flown'."
      - q: "Which sentence uses the future perfect?"
        options: ["By June, I will have finished the book.", "I finished the book.", "I am finishing the book.", "I had finished the book."]
        answer: 0
        explain: "'will have finished' is the future perfect."
      - q: "Choose the correct past participle: 'Have you ever ___ a rose garden?'"
        options: ["saw", "seen", "seeing", "sees"]
        answer: 1
        explain: "The past participle of 'see' is 'seen'."
      - q: "Choose the correct form: 'Mary ___ never ___ such a garden before.'"
        options: ["had … seen", "has … saw", "had … saw", "will … seen"]
        answer: 0
        explain: "'had seen' is the past perfect."
