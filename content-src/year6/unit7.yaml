    title: Different Voices
overview: >-
  Some stories are so good that people keep reading them for more than a hundred years. In this unit you will step into
  two classic novels: Mark Twain's tale of Tom Sawyer and a very clever trick with a fence, and Frances Hodgson
  Burnett's The Secret Garden, where a lonely girl discovers a hidden, forgotten garden. You will explore how writers
  engage readers, compare written and spoken English, use the perfect tenses, and write a character description and a
  story of your own.
objectives:
  - Identify techniques writers use to engage readers, such as vivid description, dialogue and a strong narrative voice.
  - Explain the differences between written and spoken English, and change dialogue into reported speech.
  - Understand and use idioms.
  - Spell words with the /j/ sound written j, g and dge.
  - Identify the voice of the narrator and the writer in a story.
  - Use the present perfect, past perfect and future perfect tenses.
  - Choose powerful words, perform a character, and write a character description and a story.
texts:
  - title: The Glorious Whitewasher (from The Adventures of Tom Sawyer)
    kind: Classic novel extract by Mark Twain
    pages: "155–161"
    summary: >-
      On a bright Saturday morning, Tom Sawyer has to whitewash Aunt Polly's long fence instead of playing. When his friend
      Ben comes along, ready to tease him, Tom pretends that painting is a rare privilege that only a gifted boy could do.
      Soon Ben is begging for a turn and paying for it, and by the end of the day Tom is sitting in the shade while
      his friends do the work.
  - title: The Secret Garden
    kind: Classic novel extract by Frances Hodgson Burnett
    pages: "167–172"
    summary: >-
      Mary Lennox, a lonely and cross girl who once lived in India, now lives at Misselthwaite Manor in Yorkshire. She
      finds her way into a hidden garden that nobody has looked after for years. Its roses seem dead, but Mary discovers
      that some plants are still alive, and caring for the garden begins to change her. Martha, a cheerful maid, speaks
      in a Yorkshire dialect.
vocab:
  - word: classic
    meaning: A book that has been admired for a long time and is still read today.
    example: The Secret Garden is a classic.
  - word: whitewash
    meaning: To paint something with a white mixture, often on walls or fences.
    example: Tom had to whitewash the fence.
  - word: melancholy
    meaning: A deep, quiet sadness.
    example: A deep melancholy settled over Tom.
  - word: reluctance
    meaning: Not wanting to do something.
    example: Tom handed over the brush with pretend reluctance.
  - word: idiom
    meaning: A phrase whose meaning is different from the meanings of its separate words.
    example: "'Call it a day' means stop working for now."
  - word: dialect
    meaning: A form of a language spoken in a particular area, with its own words and grammar.
    example: Martha speaks in a Yorkshire dialect.
  - word: narrator
    meaning: The voice that tells the story.
    example: The narrator describes Mary's feelings.
  - word: neglected
    meaning: Not cared for over a long time.
    example: The neglected garden was full of tangled roses.
  - word: perfect tense
    meaning: A verb form made with has, have, had or will have and a past participle.
    example: "'She had found the key' is in the past perfect tense."
  - word: engage
    meaning: To catch and hold someone's interest.
    example: A strong opening line engages the reader.
