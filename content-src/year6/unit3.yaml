id: 3
title: Stories From The Sea
colour: "#0f5c5c"
sbStart: 52
wbStart: 35
sbPages: "52–76"
wbPages: "35–51"
parts:
  - code: 3A
    title: Dangers at Sea
  - code: 3B
    title: Sea Adventures
overview: >-
  Hoist the sails! This unit is full of salty sea air and daring adventures. You will read about a clever boy who
  outwits egg pirates, and about a girl whose best friend is a one-legged seagull. Both stories use flashbacks, so you
  will learn how a memory from the past can change what happens next. Then you will write your own adventure story
  with a flashback.
objectives:
  - Explain what a flashback is and how it affects the plot of an adventure story.
  - Use adverbs and adverbial phrases of time, place and manner.
  - Recognise similes, metaphors, personification, onomatopoeia, alliteration and idioms.
  - Use suffixes to change the word class of a word.
  - Use relative pronouns and relative clauses to add information.
  - Punctuate direct speech correctly and change it into reported speech.
  - Speak confidently and fluently, and write an adventure story with a flashback.
texts:
  - title: Yao Bai and the Egg Pirates
    kind: Adventure story
    pages: "54–60"
    summary: >-
      Long ago, at the time of the California gold rush, Yao Bai sails out with his father and uncle to collect
      seabird eggs from the islands near San Francisco to sell in the city. The family is poor and needs the money,
      but the sea is home to egg pirates. When the pirates come, Yao remembers something from a fishing trip the week
      before, and his clever idea saves the family's eggs.
  - title: Katie and Gulliver
    kind: Adventure story with flashbacks
    pages: "66–72"
    summary: >-
      Every holiday, Katie stays with her uncle near the harbour, where a big one-legged seagull called Gulliver seems
      to watch over her. Flashbacks show how Gulliver has raised the alarm whenever Katie was in danger. When Katie
      ends up stranded on a rock, and Gulliver has gone missing, the story asks whether her loyal friend could still
      be looking after her.
vocab:
  - word: flashback
    meaning: A part of a story that goes back in time to show something that happened earlier.
    example: The flashback explains why Katie is afraid of the rocks.
  - word: adverbial phrase
    meaning: A group of words that tells us how, when, where or how often something happens.
    example: They sailed home in the evening light.
  - word: pirate
    meaning: Someone who attacks ships or boats at sea and steals from them.
    example: The pirates searched every boat for eggs.
  - word: wharf
    meaning: A platform by the water where boats tie up to load and unload.
    example: The boat tied up at a busy wharf in the city.
  - word: raucous
    meaning: Very loud and harsh.
    example: The gulls made a raucous noise over the harbour.
  - word: dinghy
    meaning: A small open boat.
    example: Katie climbed into the dinghy and pretended to be a sailor.
  - word: personification
    meaning: Giving human qualities to something that is not human.
    example: The waves whispered secrets to the shore.
  - word: idiom
    meaning: A phrase whose meaning is different from the meanings of its separate words.
    example: "'Under the weather' means feeling ill."
  - word: relative clause
    meaning: A clause that gives more information about a noun. It begins with who, whom, whose, which or that.
    example: The seagull, which had only one leg, landed on the post.
  - word: reported speech
    meaning: Telling what someone said without using their exact words.
    example: Katie said that she missed Gulliver.
