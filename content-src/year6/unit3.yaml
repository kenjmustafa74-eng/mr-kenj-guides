cards:
  - front: What is a flashback?
    back: A part of a story that goes back in time to show an earlier event.
  - front: How does Yao save his family's eggs from the pirates?
    back: He remembers the nets from a shrimping trip the week before, and the family uses them to trick the pirates.
  - front: Who is Gulliver?
    back: A big one-legged seagull who seems to watch over Katie and raises the alarm when she is in danger.
  - front: What is the difference between a simile and a metaphor?
    back: A simile compares using 'like' or 'as'. A metaphor says one thing is another.
  - front: Which relative pronouns do we use for people and for things?
    back: Who, whom and that for people; which and that for things; whose shows belonging.
  - front: What three questions can adverbs and adverbial phrases answer?
    back: How? (manner), When? (time) and Where? (place).
  - front: Where does the comma go in direct speech?
    back: "Inside the inverted commas: “I can see the boat,” said Yao."
practice:
  - q: What is a flashback?
    options: ["A part of the story that jumps to the future", "A part of the story that goes back to an earlier time", "The title of a story", "The last line of a story"]
    answer: 1
    explain: A flashback goes back in time to show something that happened earlier.
  - q: Which is an adverbial phrase of place?
    options: ["very carefully", "early that morning", "over the side of the boat", "every day"]
    answer: 2
    explain: "'over the side of the boat' tells us where."
  - q: "Which type of figurative language is this? 'The sea was a hungry monster.'"
    options: ["simile", "metaphor", "onomatopoeia", "alliteration"]
    answer: 1
    explain: The sea is said to be a monster, without 'like' or 'as', so it is a metaphor.
  - q: Why does the family in 'Yao Bai and the Egg Pirates' go out in their boat?
    options: ["To catch whales", "To collect eggs to sell", "To find gold", "To race the pirates"]
    answer: 1
    explain: They collect seabird eggs to sell in the city.
  - q: "Which sentence is punctuated correctly?"
    options: ["“Where is Gulliver”? asked Katie.", "“Where is Gulliver?” asked Katie.", "“Where is Gulliver? asked Katie.”", "Where is Gulliver? “asked Katie.”"]
    answer: 1
    explain: The question mark goes inside the inverted commas.
  - q: Which suffix turns 'imagine' into a noun?
    options: ["-ly", "-ation", "-ful", "-ory"]
    answer: 1
    explain: "imagine → imagination."
  - q: Which relative pronoun completes the sentence? 'The gull, ___ had one leg, sat on the post.'
    options: ["who", "which", "whose", "whom"]
    answer: 1
    explain: The gull is an animal, so 'which' is used here.
  - q: How does Gulliver help Katie in the flashbacks?
    options: ["He brings her food", "He screams to get help when she is in danger", "He steers the boat", "He finds lost eggs"]
    answer: 1
    explain: Gulliver's loud cries bring Katie's father or uncle to help.
