grammar:
  - title: Adverbs and adverbial phrases
    lesson: "Lesson 4 · Language Focus – Grammar"
    pages: "57"
    wb: "36"
    intro: >-
      Adverbs are the storyteller's secret ingredient. They tell your reader exactly how, when and where things
      happen, so a plain sentence becomes a vivid scene.
    points:
      - "An **adverb** gives more information about a verb. Many adverbs end in **-ly**: grimly, quickly, fearfully."
      - "An **adverbial phrase** is a group of words that does the same job: 'at last', 'over the side', 'early that morning'."
      - "Adverbs and adverbials can tell us about **manner** (how), **time** (when) and **place** (where)."
      - "You can move an adverbial to the front of a sentence for effect. Put a comma after it: 'At dawn, they set sail.'"
    examples:
      - text: "Yao whispered **fearfully**."
        note: "Manner: how he whispered."
      - text: "**Early that morning**, they rowed to the island."
        note: "Time: when they rowed. The fronted adverbial is followed by a comma."
      - text: "They lowered the nets **over the side of the boat**."
        note: "Place: where they lowered the nets."
    tip: "Ask the verb a question: how? when? where? The answer is your adverb or adverbial."
    practice:
      - q: "Which word is an adverb? 'The pirates rowed silently towards the boat.'"
        options: ["pirates", "rowed", "silently", "boat"]
        answer: 2
        explain: "'silently' tells us how they rowed."
      - q: "What does the adverbial phrase tell us? 'They sailed home at sunset.'"
        options: ["how", "when", "where", "how often"]
        answer: 1
        explain: "'at sunset' tells us when."
      - q: "Which is an adverbial phrase of place?"
        options: ["with great care", "after lunch", "under the nets", "very slowly"]
        answer: 2
        explain: "'under the nets' tells us where."
      - q: "Which sentence uses a fronted adverbial correctly?"
        options: ["In the morning the boat left.", "In the morning, the boat left.", "In, the morning the boat left.", "In the morning the, boat left."]
        answer: 1
        explain: "Put a comma after a fronted adverbial."
      - q: "Which adverb tells us how?"
        options: ["yesterday", "here", "carefully", "soon"]
        answer: 2
        explain: "'carefully' describes the manner of an action."
  - title: Relative pronouns and clauses
    lesson: "Lesson 12 · Language Focus – Grammar"
    pages: "69"
    wb: "44"
    intro: >-
      Relative clauses let you slip extra detail about a person or thing into your sentence without starting a new
      one. They make your writing flow like the tide.
    points:
      - "A **relative clause** gives more information about a noun. It starts with a **relative pronoun**."
      - "Use **who** for people, **which** for things and animals, **that** for people or things, **whose** for belonging and **whom** for people when they are the object."
      - "If the information is extra and not essential, put **commas** around the relative clause."
      - "If the information is essential to know which one we mean, do not use commas: 'The boat **that we borrowed** was blue.'"
    examples:
      - text: "Katie, **who loved the harbour**, visited every holiday."
        note: "Extra information about Katie, so commas are used."
      - text: "The gull **that only had one leg** was Gulliver."
        note: "Essential information that tells us which gull, so no commas."
      - text: "The sailor **whose boat was damaged** asked for help."
        note: "'whose' shows that the boat belonged to the sailor."
    tip: "Take out a relative clause in commas. If the sentence still makes sense, the commas are right."
    practice:
      - q: "Choose the correct pronoun: 'Uncle Ralph, ___ lived near the harbour, carved a bird.'"
        options: ["which", "who", "whose", "whom"]
        answer: 1
        explain: "Uncle Ralph is a person and the subject of 'lived', so we use 'who'."
      - q: "Choose the correct pronoun: 'The net, ___ was full of shrimp, was heavy.'"
        options: ["who", "whom", "which", "whose"]
        answer: 2
        explain: "A net is a thing, so we use 'which'."
      - q: "Which is the relative clause? 'The boy whose idea saved the eggs was Yao.'"
        options: ["The boy", "whose idea saved the eggs", "was Yao", "saved the eggs was"]
        answer: 1
        explain: "The relative clause begins with 'whose' and tells us more about the boy."
      - q: "Which pronoun shows belonging?"
        options: ["who", "which", "that", "whose"]
        answer: 3
        explain: "'whose' shows that something belongs to someone."
      - q: "Which sentence is punctuated correctly?"
        options: ["Gulliver which was a seagull, had one leg.", "Gulliver, which was a seagull, had one leg.", "Gulliver, which was a seagull had one leg.", "Gulliver which, was a seagull had one leg."]
        answer: 1
        explain: "The extra information needs a comma on each side."
  - title: Direct speech
    lesson: "Lesson 14 · Language Focus – Punctuation"
    pages: "73"
    wb: "47"
    intro: >-
      Dialogue brings characters to life. When your reader can 'hear' them speak, your story feels real. Let's make
      sure every word they say is punctuated perfectly.
    points:
      - "**Direct speech** shows the exact words a character says, inside **inverted commas** (“ ”)."
      - "Punctuation that belongs to the spoken words goes **inside** the inverted commas: “Look!” cried Katie."
      - "If the speech comes first, end it with a comma, question mark or exclamation mark, not a full stop, before 'said'."
      - "Start a **new line** each time a different person speaks."
      - "**Reported speech** tells us what someone said without inverted commas: Katie said that she was cold."
    examples:
      - text: "“The tide is coming in,” said Dad."
        note: "The comma goes inside the inverted commas."
      - text: "Uncle Ralph asked, “Have you seen Gulliver?”"
        note: "A comma after 'asked', and the question mark inside."
      - text: "Katie said that she had heard a seagull."
        note: "Reported speech: no inverted commas."
    tip: "Read your dialogue aloud. If it sounds like natural talking, you have probably got it right."
    practice:
      - q: "Which sentence is punctuated correctly?"
        options: ["“We must hurry” said Dad.", "“We must hurry,” said Dad.", "“We must hurry”, said Dad.", "We must hurry, “said Dad.”"]
        answer: 1
        explain: "The comma goes inside the closing inverted commas."
      - q: "Which is reported speech?"
        options: ["“I am cold,” said Katie.", "Katie said, “I am cold.”", "Katie said that she was cold.", "“Cold!” said Katie."]
        answer: 2
        explain: "Reported speech has no inverted commas and usually uses 'that'."
      - q: "When should you start a new line in dialogue?"
        options: ["After every comma", "When a different person speaks", "Only at the end of a chapter", "Never"]
        answer: 1
        explain: "Each new speaker starts on a new line."
      - q: "Which is correct?"
        options: ["Yao asked, “Are they pirates?”", "Yao asked, “Are they pirates”?", "Yao asked “Are they pirates.”", "Yao asked, Are they pirates?"]
        answer: 0
        explain: "A comma after 'asked', and the question mark inside the inverted commas."
      - q: "What are inverted commas used for?"
        options: ["To show the exact words someone says", "To end a sentence", "To join two clauses", "To show a list"]
        answer: 0
        explain: "Inverted commas go around the exact words spoken."
