    title: "Let's Learn: Features of one-sided arguments"
    pages: "18"
    steps:
      - "Question 1: label the parts of the argument."
      - "Questions 2–3: find the writer's reasons and the main point of view."
      - "Questions 4–6: find connectives, the passive voice and the writer's conclusion."
    tip: Look back at Student's Book pages 28–29 for the features of a one-sided argument.
  - code: 2B
    title: "Language Focus: Active and passive verbs"
    pages: "19"
    steps:
