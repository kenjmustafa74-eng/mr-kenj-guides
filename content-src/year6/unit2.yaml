grammar:
  - title: Active and passive verbs
    lesson: "Lesson 4 · Language Focus – Grammar"
    pages: "33"
    wb: "19"
    intro: >-
      Have you noticed how formal writing sometimes sounds a bit like a science report? That is often because of the
      passive voice. Learning to switch between active and passive gives you real control over your writing.
    points:
      - "In the **active voice**, the subject does the action: 'Whales **store** carbon.'"
      - "In the **passive voice**, the subject has the action done to it: 'Carbon **is stored** by whales.'"
      - "The passive is made with a form of **be** (is, are, was, were, will be) plus the **past participle** (stored, written, caught)."
      - "Writers use the passive in formal writing, or when the doer is unknown or not important."
    examples:
      - text: "Scientists **studied** the whales."
        note: "Active: the scientists did the studying."
      - text: "The whales **were studied** by scientists."
        note: "Passive: the whales had the action done to them."
      - text: "The nets **were removed** from the reef."
        note: "Passive without 'by': we do not need to know who did it."
    tip: "If you can add 'by …' after the verb and it makes sense, the sentence is probably passive."
    practice:
      - q: "Which sentence is active?"
        options: ["The net was cut by the diver.", "The diver cut the net.", "The net is cut.", "The net was cut."]
        answer: 1
        explain: "The subject, 'the diver', does the action."
      - q: "Which sentence is passive?"
        options: ["Krill feed the whales.", "The whale sang.", "The beach was cleaned by volunteers.", "Volunteers cleaned the beach."]
        answer: 2
        explain: "'was cleaned' is a form of 'be' plus a past participle, so it is passive."
      - q: "Change to the passive: 'The children planted the trees.'"
        options: ["The trees planted the children.", "The trees were planted by the children.", "The children were planted.", "The trees are planting."]
        answer: 1
        explain: "The object, 'the trees', becomes the subject, and we use 'were planted'."
      - q: "Change to the active: 'The article was written by Maya.'"
        options: ["Maya wrote the article.", "Maya was written.", "The article wrote Maya.", "The article is writing."]
        answer: 0
        explain: "Maya did the writing, so she becomes the subject."
      - q: "Why might a writer choose the passive voice?"
        options: ["To sound informal", "To focus on the action when the doer is not important", "To ask a question", "To make a list"]
        answer: 1
        explain: "The passive puts the focus on the action or the thing affected."
  - title: Linking adverbials
    lesson: "Lesson 7 · Language Focus – Grammar"
    pages: "37"
    wb: "22"
    intro: >-
      An argument is like a bridge made of ideas. Linking adverbials are the bolts that hold it together, guiding
      your reader smoothly from one point to the next.
    points:
      - "**Linking adverbials** connect ideas across sentences and paragraphs."
      - "To **add** a point: furthermore, moreover, in addition, besides."
      - "To **compare**: similarly, likewise. To **contrast**: however, on the other hand."
      - "To show a **result**: consequently, therefore, as a result."
      - "When a linking adverbial starts a sentence, put a comma after it."
    examples:
      - text: "Whales store carbon. **Furthermore**, they help phytoplankton to grow."
        note: "Adds a second point."
      - text: "Plastic harms turtles. **Similarly**, it harms seabirds."
        note: "Shows that two ideas are alike."
      - text: "Ships carry our food. **However**, they can harm sea creatures."
        note: "Shows the other side."
    tip: "Do not use 'and' or 'but' to start every sentence. Swap in a linking adverbial instead."
    practice:
      - q: "Which linking adverbial shows a contrast?"
        options: ["Furthermore", "However", "In addition", "Moreover"]
        answer: 1
        explain: "'However' introduces a different or opposite idea."
      - q: "Which linking adverbial shows that two things are alike?"
        options: ["Similarly", "Consequently", "Besides", "However"]
        answer: 0
        explain: "'Similarly' compares two ideas."
      - q: "Choose the best word: 'Whales attract tourists. ___, tourism creates jobs.'"
        options: ["However", "In addition", "Instead", "Otherwise"]
        answer: 1
        explain: "We are adding a further point, so 'In addition' fits."
      - q: "Which sentence is punctuated correctly?"
        options: ["Moreover whales are beautiful.", "Moreover, whales are beautiful.", "Moreover whales, are beautiful.", "Moreover; whales are beautiful."]
        answer: 1
        explain: "Put a comma after a linking adverbial at the start of a sentence."
      - q: "Which linking adverbial shows a result?"
        options: ["Likewise", "Besides", "Consequently", "Similarly"]
        answer: 2
        explain: "'Consequently' means 'as a result'."
  - title: Quantifiers
    lesson: "Lesson 14 · Language Focus – Grammar"
    pages: "47"
    wb: "29"
    intro: >-
      How many fish are in the sea? How much plastic is in the ocean? Quantifiers help you to answer questions like
      these precisely, and choosing the right one is a sign of a careful writer.
    points:
      - "A **quantifier** tells us how much or how many."
      - "**Countable nouns** can be counted (whales, nets): use **many**, **few**, **fewer**."
      - "**Uncountable nouns** cannot be counted (water, pollution): use **much**, **little**, **less**."
      - "**Some**, **any**, **a lot of** and **plenty of** work with both."
      - "We usually use **any** in questions and negative sentences: 'Are there any sharks?'"
    examples:
      - text: "There are **fewer** whales than there were a hundred years ago."
        note: "Whales can be counted."
      - text: "We should use **less** plastic."
        note: "Plastic (as a material) is uncountable."
      - text: "How **much** oil was spilt? How **many** birds were affected?"
        note: "'much' for uncountable, 'many' for countable."
    tip: "Try putting a number in front of the noun. If 'three whales' works, use many or fewer."
    practice:
      - q: "Choose the correct word: 'There is ___ rubbish on the beach today.'"
        options: ["fewer", "less", "many", "a few"]
        answer: 1
        explain: "Rubbish is uncountable, so we use 'less'."
      - q: "Choose the correct word: 'How ___ dolphins did you see?'"
        options: ["much", "many", "less", "little"]
        answer: 1
        explain: "Dolphins can be counted, so we use 'many'."
      - q: "Which noun is uncountable?"
        options: ["ship", "net", "water", "whale"]
        answer: 2
        explain: "We cannot count water, so it is uncountable."
      - q: "Choose the correct sentence."
        options: ["There are less fish this year.", "There are fewer fish this year.", "There are much fish this year.", "There is many fish this year."]
        answer: 1
        explain: "Fish can be counted here, so 'fewer' is correct."
      - q: "Which quantifier fits a question? 'Are there ___ turtles in this bay?'"
        options: ["any", "much", "less", "little"]
        answer: 0
        explain: "We usually use 'any' in questions."
