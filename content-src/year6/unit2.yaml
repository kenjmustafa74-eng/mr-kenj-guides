id: 2
title: Saving Our Oceans
colour: "#1f6f8b"
sbStart: 27
wbStart: 18
sbPages: "27–51"
wbPages: "18–34"
parts:
  - code: 2A
    title: Protecting Marine Animals
  - code: 2B
    title: Marine Life Endangered
overview: >-
  Our oceans cover most of our planet, and the creatures in them need our help. In this unit you will read two
  arguments about marine life: one that argues strongly for protecting whales, and one that weighs up whether ships
  are the biggest threat to sea creatures. You will learn how writers build an argument, how to use formal language and
  the passive voice, and then you will write a powerful argument of your own.
objectives:
  - Identify the features of one-sided and balanced arguments.
  - Use active and passive verbs, and explain why writers choose the passive voice in formal writing.
  - Use linking adverbials and opening phrases to connect ideas in an argument.
  - Add prefixes and suffixes to root words, and work out what new words mean.
  - Choose the correct quantifiers for countable and uncountable nouns.
  - Listen to a balanced argument and identify the facts and the writer's final point of view.
  - Plan and write a one-sided argument and an argumentative essay.
texts:
  - title: Whales are Good for Our Planet!
    kind: One-sided argument
    pages: "30–36"
    summary: >-
      This argument tells us that whales are our friends in the fight against climate change. Over its long life, a
      whale stores a huge amount of carbon in its body, far more than a tree. Whales also help tiny phytoplankton to
      grow, and phytoplankton take in carbon dioxide too. The writer adds that whale watching helps coastal
      communities to earn a living, and concludes that we must protect whales.
  - title: Are Ships the Main Threat to Marine Life?
    kind: Balanced argument
    pages: "41–46"
    summary: >-
      This argument looks at both sides. Ships can strike marine animals, their noise confuses creatures that use
      echolocation, and oil spills and overfishing cause great harm. However, ships are important for trade and
      food. The writer concludes that ships are only one of the threats to marine life, and that ships can be made
      kinder to the ocean, for example by travelling more slowly.
  - title: Is Climate Change the Main Cause of the Decline in Whale Populations?
    kind: Listening text (balanced argument)
    pages: "48"
    summary: >-
      A balanced argument about whether climate change is the main reason why whale numbers have fallen. It explains
      how warming oceans affect the whales' food, and it considers other human activities that may also play a part.
vocab:
  - word: argument
    meaning: A piece of writing that gives reasons to persuade the reader to agree with a point of view.
    example: Her argument was full of facts and strong reasons.
  - word: one-sided argument
    meaning: An argument that gives the reasons for only one point of view.
    example: The article about whales is a one-sided argument.
  - word: balanced argument
    meaning: An argument that gives both sides before the writer gives a final opinion.
    example: A balanced argument helps readers to make up their own minds.
  - word: carbon dioxide
    meaning: A gas released when fuels are burnt. Too much of it in the air warms our planet.
    example: Trees and phytoplankton take in carbon dioxide.
  - word: phytoplankton
    meaning: Tiny, plant-like living things that float near the surface of the sea.
    example: Phytoplankton are so small that you need a microscope to see them.
  - word: climate change
    meaning: Long-term changes in the Earth's temperature and weather patterns.
    example: Climate change is making some oceans warmer.
  - word: bycatch
    meaning: Sea creatures that are caught in fishing nets by accident.
    example: Dolphins and turtles are sometimes caught as bycatch.
  - word: echolocation
    meaning: A way some animals find their way by sending out sounds and listening to the echoes.
    example: Loud ships can confuse whales that use echolocation.
  - word: passive voice
    meaning: A way of writing in which the thing that receives the action becomes the subject of the sentence.
    example: "'Carbon is stored by whales' is written in the passive voice."
  - word: quantifier
    meaning: A word that tells us how much or how many, such as many, much, few, less or some.
    example: There are fewer whales than there once were.
