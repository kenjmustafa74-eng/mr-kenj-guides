cards:
  - front: What is the difference between a one-sided and a balanced argument?
    back: A one-sided argument gives reasons for one point of view only. A balanced argument gives both sides before the writer's opinion.
  - front: How do whales help in the fight against climate change?
    back: They store a large amount of carbon in their bodies and help phytoplankton to grow, which take in carbon dioxide.
  - front: Why do writers use the passive voice in formal writing?
    back: It sounds more formal and puts the focus on the action or the thing affected, not the person doing it.
  - front: Name three threats to marine life from the second argument.
    back: Ship strikes, noise from ships, oil spills and overfishing (any three).
  - front: When do we use 'fewer' and when do we use 'less'?
    back: Use 'fewer' with things you can count (fewer whales) and 'less' with things you cannot count (less water).
  - front: Give two linking adverbials that add information.
    back: Furthermore, moreover, in addition, besides (any two).
  - front: What should the conclusion of an argument do?
    back: Sum up the main points and clearly state the writer's point of view.
practice:
  - q: Which sentence is in the passive voice?
    options: ["Whales store carbon.", "Carbon is stored by whales.", "Whales eat krill.", "Tourists watch whales."]
    answer: 1
    explain: The subject, 'carbon', receives the action, so the sentence is passive.
  - q: What does a balanced argument do?
    options: ["Gives only one point of view", "Gives both sides before a final opinion", "Tells a story", "Gives instructions"]
    answer: 1
    explain: A balanced argument looks at both sides of the issue.
  - q: Which linking adverbial adds another point?
    options: ["However", "Furthermore", "Although", "Instead"]
    answer: 1
    explain: "'Furthermore' adds a further point to the argument."
  - q: "Choose the correct quantifier: 'There are ___ whales in the bay this year.'"
    options: ["less", "much", "fewer", "little"]
    answer: 2
    explain: Whales can be counted, so we use 'fewer'.
  - q: According to 'Whales are Good for Our Planet!', why should we protect whales?
    options: ["They help to fight climate change", "They are good to eat", "They keep ships safe", "They make the sea warmer"]
    answer: 0
    explain: The writer argues that whales help us to fight climate change.
  - q: What is bycatch?
    options: ["A type of whale", "Sea creatures caught in nets by accident", "A ship's engine", "A fishing competition"]
    answer: 1
    explain: Bycatch means creatures that are caught by accident.
  - q: Which opening phrase is best for a formal argument?
    options: ["Everyone knows that", "It is often argued that", "I just think", "Obviously"]
    answer: 1
    explain: "'It is often argued that' sounds formal and fair."
  - q: Which prefix means 'not' or 'the opposite of'?
    options: ["dis-", "multi-", "inter-", "ex-"]
    answer: 0
    explain: "'dis-' means not, as in 'disagree'."
