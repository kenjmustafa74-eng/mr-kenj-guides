grammar:
  - title: Shades of meaning
    lesson: "Lesson 4 · Language Focus – Vocabulary"
    pages: "107–108"
    wb: "70"
    intro: >-
      Poets are word detectives. They hunt for the one word that fits exactly. Is a light flickering, glowing or blazing?
      Each choice paints a different picture, and now you can choose like a poet too.
    points:
      - "Words with **similar meanings** can still have **different strengths** or feelings."
      - "Put similar words on a **scale**: flickering → glowing → blazing; still → hushed → tranquil."
      - "This works for **adjectives**, **verbs** and **adverbs**: walk → stride → march; quietly → silently."
      - "Choose the shade that fits your **mood** and **theme**."
    examples:
      - text: "The candle **flickered** in the draught."
        note: "A weak, unsteady light."
      - text: "The fire **blazed** across the hillside."
        note: "A strong, fierce light."
      - text: "The wind **whispered** … the wind **howled**."
        note: "The verbs create two very different moods."
    tip: "Ask: is this word too strong, too weak or just right for the mood?"
    practice:
      - q: "Which verb shows the fastest movement?"
        options: ["walked", "strolled", "dashed", "wandered"]
        answer: 2
        explain: "'Dashed' means moved very quickly."
      - q: "Which word suits a peaceful poem best?"
        options: ["roaring", "tranquil", "furious", "screeching"]
        answer: 1
        explain: "'Tranquil' means calm and peaceful."
      - q: "Put these in order from weakest to strongest: hot, warm, scorching."
        options: ["hot, warm, scorching", "warm, hot, scorching", "scorching, hot, warm", "warm, scorching, hot"]
        answer: 1
        explain: "Warm is weakest and scorching is strongest."
      - q: "Which word is the most powerful way to say 'big'?"
        options: ["large", "gigantic", "fairly big", "sizeable"]
        answer: 1
        explain: "'Gigantic' is the strongest choice."
      - q: "Why do poets think about shades of meaning?"
        options: ["To make poems longer", "To say exactly what they mean and create a mood", "To make spelling easier", "To avoid rhymes"]
        answer: 1
        explain: "The precise word creates the right picture and feeling."
  - title: Imagery in poetry
    lesson: "Lesson 7 · Language Focus – Vocabulary"
    pages: "112"
    wb: "74"
    intro: >-
      Close your eyes and listen to a good poem. Can you see it? That is imagery at work. These tools help your reader
      see, hear and feel your words.
    points:
      - "A **simile** compares two things using **like** or **as**: 'as quick as a lightning bolt'."
      - "A **metaphor** says one thing **is** another: 'The clouds were cotton balls.'"
      - "**Personification** gives human qualities to things that are not human: 'The wind ran away with the papers.'"
      - "**Alliteration** repeats the first sound of nearby words; **onomatopoeia** uses words that sound like their meaning."
    examples:
      - text: "The eagle fell **like a thunderbolt**."
        note: "A simile."
      - text: "The leaves **drank** the rain."
        note: "Personification: leaves cannot really drink."
      - text: "**S**ilver **s**treams **s**parkled."
        note: "Alliteration with the /s/ sound."
    tip: "When you spot an image, explain what it makes you picture AND how it makes you feel."
    practice:
      - q: "Which is a simile?"
        options: ["The moon was a lantern.", "The moon smiled.", "The moon shone like a lantern.", "Moonlight melted."]
        answer: 2
        explain: "It compares using 'like'."
      - q: "Which is a metaphor?"
        options: ["The snow was a white blanket.", "The snow was as white as milk.", "The snow whispered.", "Crunch went the snow."]
        answer: 0
        explain: "It says the snow IS a blanket."
      - q: "Which is onomatopoeia?"
        options: ["gentle", "splash", "river", "quiet"]
        answer: 1
        explain: "'Splash' sounds like the noise it describes."
      - q: "Which device is used? 'The thunder grumbled angrily.'"
        options: ["simile", "personification", "alliteration", "rhyme"]
        answer: 1
        explain: "Thunder cannot really grumble angrily, so it is given human qualities."
      - q: "Which sentence uses alliteration?"
        options: ["Big brown bears bounced.", "The bear was big.", "The bear roared.", "The bear was like a mountain."]
        answer: 0
        explain: "The /b/ sound is repeated."
  - title: Synonyms and antonyms
    lesson: "Lesson 12 · Language Focus – Vocabulary"
    pages: "119"
    wb: "78"
    intro: >-
      Using the same word again and again is like eating the same lunch every day. Synonyms give your writing variety,
      and antonyms help you to show contrast.
    points:
      - "A **synonym** has the same or nearly the same meaning: huge, enormous, gigantic."
      - "An **antonym** has the opposite meaning: calm and stormy; trust and doubt."
      - "Some antonyms are made with **prefixes**: happy and unhappy; possible and impossible."
      - "A **thesaurus** helps you to find synonyms and antonyms."
    examples:
      - text: "The pool was noisy, but under the water it was **silent**."
        note: "'Noisy' and 'silent' are antonyms that show contrast."
      - text: "She was **exhausted** after the swim."
        note: "A stronger synonym for 'tired'."
      - text: "The leaves **tumbled** and **toppled** from the trees."
        note: "Two synonyms that also create alliteration."
    tip: "After using a thesaurus, always check that the new word fits the sentence."
    practice:
      - q: "Which is a synonym of 'angry'?"
        options: ["furious", "calm", "joyful", "sleepy"]
        answer: 0
        explain: "'Furious' means very angry."
      - q: "Which is an antonym of 'win'?"
        options: ["gain", "lose", "succeed", "earn"]
        answer: 1
        explain: "'Lose' is the opposite of 'win'."
      - q: "Which is a synonym of 'soaked'?"
        options: ["dry", "drenched", "warm", "dusty"]
        answer: 1
        explain: "'Drenched' means soaked."
      - q: "Which is an antonym of 'trust'?"
        options: ["believe", "doubt", "rely", "hope"]
        answer: 1
        explain: "'Doubt' is the opposite of 'trust'."
      - q: "Which is an antonym of 'open'?"
        options: ["shut", "wide", "unlocked", "clear"]
        answer: 0
        explain: "'Shut' means the opposite of 'open'."
