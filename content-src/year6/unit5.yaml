cards:
  - front: What is the theme of a poem?
    back: The main idea or message that the poet wants to share.
  - front: What is an acrostic poem?
    back: A poem in which the first letters of the lines spell a word when you read them downwards.
  - front: What is the rhyme scheme of a poem written in rhyming couplets?
    back: AABBCC and so on, because each pair of lines rhymes.
  - front: What does the eagle do at the end of Tennyson's poem?
    back: It swoops down, like a thunderbolt, to hunt.
  - front: What does the girl in 'Deep-Sea Diving' imagine?
    back: That the busy school pool is the deep, quiet sea.
  - front: When do we usually spell the sound with tch?
    back: After a short vowel sound, as in match, fetch and stretch.
  - front: What is the difference between a synonym and an antonym?
    back: A synonym means the same. An antonym means the opposite.
practice:
  - q: What is the theme of a poem?
    options: ["Its title", "Its main message", "Its last line", "Its number of lines"]
    answer: 1
    explain: The theme is the main idea or message.
  - q: Which word is the strongest? (glowing, flickering, blazing)
    options: ["flickering", "glowing", "blazing", "They are all the same"]
    answer: 2
    explain: "'Blazing' describes the brightest, fiercest light."
  - q: "What is the rhyme scheme? Line endings: cat, hat, sun, fun"
    options: ["ABAB", "AABB", "ABCB", "ABBA"]
    answer: 1
    explain: The first two lines rhyme and the next two rhyme, so it is AABB.
  - q: "Which is personification?"
    options: ["The trees cried in the wind.", "The sky was as blue as the sea.", "Crash! went the thunder.", "Silver snakes slid silently."]
    answer: 0
    explain: Trees cannot really cry, so they are given a human action.
  - q: Which word is spelt correctly?
    options: ["strech", "stretch", "streatch", "stretsh"]
    answer: 1
    explain: After the short vowel sound, we use tch.
  - q: Which is an antonym of 'calm'?
    options: ["peaceful", "still", "stormy", "tranquil"]
    answer: 2
    explain: "'Stormy' means the opposite of 'calm'."
  - q: What does the girl in 'Deep-Sea Diving' like about being underwater?
    options: ["It is noisy", "It is calm and quiet", "It is crowded", "It is cold"]
    answer: 1
    explain: She enjoys the calm, quiet world away from the noise above.
  - q: What is a rhyming couplet?
    options: ["Two lines next to each other that rhyme", "A poem with no rhymes", "A list of synonyms", "A poem about two people"]
    answer: 0
    explain: A couplet is a pair of lines that rhyme.
