parts:
  - code: 5A
    title: Inspired by Nature
  - code: 5B
    title: Out and About in Nature
overview: >-
  Step outside and listen! In this unit you will read poems inspired by the natural world: an eagle on a cliff, a spider
  spinning its web, a field of golden daffodils, a stormy night and a quiet snowy wood. You will explore the themes and
  images in poems, choose words with exactly the right shade of meaning, and learn how rhyme schemes work. Then you
  will write an acrostic poem and a poem with rhyming couplets.
objectives:
  - Identify the themes of poems and explain how poets show them.
  - Choose words with the right shade of meaning to create atmosphere.
  - Explain how imagery, such as similes, metaphors and personification, creates pictures in the reader's mind.
  - Spell words with the consonant blends ch and tch.
  - Identify rhyme schemes and rhyming couplets.
  - Use synonyms and antonyms to make writing precise and interesting.
  - Perform a poem aloud, and write an acrostic poem and a poem with rhyming couplets.
texts:
  - title: "Poetry Part 1: Nature, Hurt No Living Thing, The Rain and Windy Nights"
    kind: Poems
    pages: "105–106"
    summary: >-
      An acrostic poem whose first letters spell NATURE celebrates the sights and sounds of the natural world. Christina
      Rossetti's 'Hurt No Living Thing' asks us to be kind to every creature, however small. 'The Rain' shows nature
      helping nature, and Robert Louis Stevenson's 'Windy Nights' brings a loud, stormy night to life.
  - title: "Poetry Part 2: The Eagle, A Noiseless Patient Spider and I Wandered Lonely as a Cloud"
    kind: Poems
    pages: "109–111"
    summary: >-
      Alfred Tennyson's eagle grips a rocky cliff and then swoops down to hunt. Walt Whitman watches a patient spider
      spinning thread after thread. William Wordsworth remembers a field of daffodils by a lake that turned his lonely mood
      into joy.
  - title: Deep-Sea Diving and If
    kind: Rhyming poems
    pages: "117–118"
    summary: >-
      In 'Deep-Sea Diving', a girl in a busy school swimming pool imagines that she is diving in the deep, quiet sea,
      far away from the noise above. An extract from Rudyard Kipling's 'If' gives advice about staying calm and doing what
      is right.
  - title: My Shadow, Stopping by Woods on a Snowy Evening and October Storm
    kind: Rhyming poems
    pages: "120–122"
    summary: >-
      Robert Louis Stevenson describes a child's playful shadow that grows and shrinks. Robert Frost's traveller pauses
      to watch snow falling in a quiet wood but must travel on. 'October Storm' fills the air with wind, rain and
      tumbling leaves.
vocab:
  - word: theme
    meaning: The main idea or message of a poem or story.
    example: The theme of the poem is kindness to all creatures.
  - word: acrostic poem
    meaning: A poem in which the first letters of the lines spell a word when read downwards.
    example: The first letters of my acrostic poem spell FOREST.
  - word: imagery
    meaning: Language that creates pictures in the reader's mind.
    example: The imagery helped me to see the stormy night.
  - word: shades of meaning
    meaning: Small differences in meaning between words that are similar.
    example: "'Glowing' and 'blazing' have different shades of meaning."
  - word: tranquil
    meaning: Calm, quiet and peaceful.
    example: The lake was tranquil in the early morning.
  - word: rhyme scheme
    meaning: The pattern of rhymes at the ends of the lines in a poem, shown with letters such as AABB.
    example: This poem has the rhyme scheme ABAB.
  - word: rhyming couplet
    meaning: Two lines next to each other that rhyme.
    example: The poem is written in rhyming couplets, so its rhyme scheme is AABB.
  - word: synonym
    meaning: A word that means the same or nearly the same as another word.
    example: "'Huge' is a synonym of 'enormous'."
  - word: antonym
    meaning: A word that means the opposite of another word.
    example: "'Calm' is an antonym of 'stormy'."
  - word: stanza
    meaning: A group of lines in a poem, like a paragraph in a story.
    example: The Eagle has two stanzas.
