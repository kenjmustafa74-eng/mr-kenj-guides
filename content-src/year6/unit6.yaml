grammar:
  - title: More about indirect speech
    lesson: "Lesson 4 · Language Focus – Punctuation"
    pages: "132"
    wb: "88"
    intro: >-
      Reporters, scientists and storytellers all need to tell us what other people said. Indirect speech lets you do
      that smoothly. Today we will focus on reporting questions, which is a real Year 6 skill.
    points:
      - "**Indirect (reported) speech** tells us what someone said without using their exact words or inverted commas."
      - "The tense usually moves **back**: is → was; can → could; will → would."
      - "**Pronouns** and time words change: 'I' → he or she; 'today' → that day."
      - "To report a yes/no question, use **if** or **whether**: She asked **if** I had seen it."
      - "To report a wh- question, keep the question word but use **statement word order**, and end with a full stop: He asked where the turbines **were**."
    examples:
      - text: "“Is wind power free?” asked Leo. → Leo asked if wind power was free."
        note: "A yes/no question reported with 'if'."
      - text: "“Why do we burn coal?” the writer asked. → The writer asked why we burned coal."
        note: "The question word stays, but the word order changes."
      - text: "“I will plant trees,” said Mina. → Mina said that she would plant trees."
        note: "The tense and the pronoun change."
    tip: "No question marks in indirect questions! They are statements about a question."
    practice:
      - q: "Report this: “Can we use solar panels?” asked Sam."
        options: ["Sam asked if they could use solar panels.", "Sam asked can we use solar panels?", "Sam asked, “if they could use solar panels.”", "Sam asked could they use solar panels."]
        answer: 0
        explain: "Use 'if', change 'can' to 'could' and 'we' to 'they', and end with a full stop."
      - q: "Which indirect question is correct?"
        options: ["She asked where was the dam.", "She asked where the dam was.", "She asked where the dam was?", "She asked, where the dam was."]
        answer: 1
        explain: "Statement word order and a full stop."
      - q: "Report this: “I am tired,” said Ali."
        options: ["Ali said that I am tired.", "Ali said that he was tired.", "Ali said he is tired?", "Ali said, he was tired."]
        answer: 1
        explain: "'I' becomes 'he' and 'am' becomes 'was'."
      - q: "Which word can report a yes/no question?"
        options: ["whether", "because", "although", "unless"]
        answer: 0
        explain: "'If' or 'whether' report yes/no questions."
      - q: "What punctuation ends an indirect question?"
        options: ["a question mark", "a full stop", "inverted commas", "a colon"]
        answer: 1
        explain: "An indirect question is a statement, so it ends with a full stop."
  - title: Word classes
    lesson: "Lesson 12 · Language Focus – Grammar"
    pages: "143"
    wb: "95"
    intro: >-
      Every word in a sentence has a job, like players in a team. When you know each word's job, you can build
      sentences that are clear, correct and powerful.
    points:
      - "**Nouns** name things (energy, panels). **Pronouns** replace nouns (they, it)."
      - "**Verbs** show actions or states (generate, is). **Adjectives** describe nouns (clean, solar)."
      - "**Adverbs** describe verbs, adjectives or other adverbs (cleanly, very)."
      - "**Prepositions** show position or time (in, on, of). **Conjunctions** join words or clauses (and, but, because)."
      - "**Determiners** come before nouns to show which or how many (the, a, some, this, its)."
    examples:
      - text: "**The** (determiner) **wind** (noun) **turns** (verb) **huge** (adjective) **blades** (noun) **quickly** (adverb)."
        note: "Each word has its own job."
      - text: "They built **a** farm **on** the hill **and** it worked."
        note: "A determiner, a preposition and a conjunction."
      - text: "We **paint** walls. / We bought some **paint**."
        note: "The same word can be a verb or a noun, depending on its job."
    tip: "Do not guess from the word alone. Look at how it is used in the sentence."
    practice:
      - q: "What word class is 'solar' in 'solar panels'?"
        options: ["noun", "verb", "adjective", "adverb"]
        answer: 2
        explain: "'Solar' describes the panels, so it is an adjective."
      - q: "Which word is a preposition? 'The panels sit on the roof.'"
        options: ["panels", "sit", "on", "roof"]
        answer: 2
        explain: "'On' shows position."
      - q: "Which word is a determiner? 'Some farms use biogas.'"
        options: ["Some", "farms", "use", "biogas"]
        answer: 0
        explain: "'Some' comes before the noun and tells us how many."
      - q: "What word class is 'they' in 'They built a dam'?"
        options: ["noun", "pronoun", "conjunction", "determiner"]
        answer: 1
        explain: "'They' replaces a noun, so it is a pronoun."
      - q: "Which word is a conjunction? 'It is cheap and it is clean.'"
        options: ["cheap", "and", "is", "clean"]
        answer: 1
        explain: "'And' joins the two clauses."
  - title: Verb forms
    lesson: "Lesson 14 · Language Focus – Grammar"
    pages: "147"
    wb: "98"
    intro: >-
      Verbs are shape-shifters! The same verb can take several forms, and each one helps you to show exactly when and
      how something happens.
    points:
      - "The **base form**: generate, spin, capture."
      - "The **third person singular present**: generates, spins, captures."
      - "The **present participle** (-ing form): generating, spinning, capturing. It is used with 'is', 'are' or 'was'."
      - "The **simple past**: generated, spun, captured."
      - "The **past participle**: generated, spun, captured. It is used with 'has', 'have' or 'had', and in the passive."
    examples:
      - text: "The turbine **spins**."
        note: "Third person singular present."
      - text: "The turbines **are spinning**."
        note: "Present participle with 'are'."
      - text: "The panels **have captured** sunlight all day."
        note: "Past participle with 'have'."
    tip: "Irregular verbs change in surprising ways: write, wrote, written. Learn them in sets of three."
    practice:
      - q: "Which is the present participle of 'generate'?"
        options: ["generates", "generated", "generating", "generate"]
        answer: 2
        explain: "The present participle ends in -ing."
      - q: "Choose the correct form: 'Solar power ___ more popular every year.'"
        options: ["become", "becomes", "becoming", "become's"]
        answer: 1
        explain: "Third person singular present: becomes."
      - q: "Choose the correct form: 'They have ___ a new dam.'"
        options: ["build", "builded", "built", "building"]
        answer: 2
        explain: "After 'have', use the past participle: built."
      - q: "Which is the simple past of 'spin'?"
        options: ["spinned", "spun", "spinning", "spins"]
        answer: 1
        explain: "'Spin' is irregular: spin, spun, spun."
      - q: "Which sentence uses a past participle?"
        options: ["The sun shines.", "The panel has stored energy.", "The panel stores energy.", "The panel is storing energy."]
        answer: 1
        explain: "'stored' after 'has' is a past participle."
