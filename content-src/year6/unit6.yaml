cards:
  - front: What is a rhetorical question?
    back: A question asked for effect, to make the reader think or agree, not to get an answer.
  - front: Give two reasons for using wind power from the first article.
    back: It is clean and does not pollute the air, and it is renewable, so it will never run out.
  - front: Give two reasons against wind farms from the second article.
    back: They can harm birds and bats, spoil the landscape, and only work when the wind blows (any two).
  - front: Which renewable energy source does the third article argue is best?
    back: Solar energy.
  - front: How do you change a question into indirect speech?
    back: "Use 'if', 'whether' or a question word, change the tense and pronouns, and end with a full stop: She asked if I had seen it."
  - front: What is the difference between a fact and an opinion?
    back: A fact can be checked and proved. An opinion is what someone thinks or believes.
  - front: Name the five forms of the verb 'generate'.
    back: generate, generates, generating, generated (simple past) and generated (past participle).
practice:
  - q: Which is a rhetorical question?
    options: ["What time is it?", "Who wouldn't want free, clean energy?", "Where is my bag?", "How old are you?"]
    answer: 1
    explain: It is asked to persuade, not to get an answer.
  - q: Which sentence is an opinion?
    options: ["Wind turbines turn kinetic energy into electricity.", "Wind energy is definitely the best option.", "Coal is a fossil fuel.", "The sun rises in the east."]
    answer: 1
    explain: "'Definitely the best' is what the writer believes. It cannot be proved."
  - q: "Change to indirect speech: 'Where is the wind farm?' she asked."
    options: ["She asked where is the wind farm?", "She asked where the wind farm was.", "She asked, where was the wind farm.", "She asked where the wind farm is?"]
    answer: 1
    explain: The word order changes, the tense moves back, and there is no question mark.
  - q: Which suffix completes 'electri___' (a person who fixes wiring)?
    options: ["-tion", "-sion", "-cian", "-ssion"]
    answer: 2
    explain: "electrician – -cian is used for many jobs."
  - q: "What word class is 'cleanly' in 'Wind powers homes cleanly'?"
    options: ["noun", "adjective", "adverb", "verb"]
    answer: 2
    explain: "'Cleanly' tells us how, so it is an adverb."
  - q: Why might wind farms be unreliable, according to their critics?
    options: ["They only work when the wind blows", "They use too much coal", "They are too small", "They work only at night"]
    answer: 0
    explain: No wind means no electricity from turbines.
  - q: What does 'geothermal' mean?
    options: ["Heat from deep inside the Earth", "Energy from waves", "Light from the Sun", "Power from coal"]
    answer: 0
    explain: "'geo' means Earth and 'thermal' means heat."
  - q: Which is a renewable source of energy?
    options: ["coal", "oil", "sunlight", "natural gas"]
    answer: 2
    explain: Sunlight will not run out, so it is renewable.
