id: 6
title: Looking After Our Planet
colour: "#2f6b4f"
sbStart: 127
wbStart: 86
sbPages: "127–151"
wbPages: "86–102"
parts:
  - code: 6A
    title: Sources of Energy
  - code: 6B
    title: Renewable Resources
overview: >-
  How should we power our homes, schools and cities without harming the Earth? In this unit you will read persuasive
  articles about wind, sun, water and other sources of energy. Some writers love wind farms, and some do not! You will
  learn the tricks persuasive writers use, practise indirect speech, word classes and verb forms, and then write a
  persuasive news article of your own.
objectives:
  - Identify persuasive devices, such as rhetorical questions, short emphatic statements and emotive language.
  - Tell the difference between facts and opinions, and between persuasive and argumentative texts.
  - Change direct speech into indirect (reported) speech, including questions.
  - Spell words with the suffixes -tion, -cian, -sion, -ssion, -ence and -ance.
  - Identify word classes, including determiners, prepositions and conjunctions.
  - Use different verb forms, including participles.
  - Give a short presentation, and write a persuasive paragraph and a persuasive news article.
texts:
  - title: "The Wind: A Clean and Abundant Energy Source"
    kind: Persuasive article
    pages: "130–131"
    summary: >-
      This article persuades us that wind is a wonderful source of energy. People have used the wind for a very long time
      to sail boats, pump water and grind grain. Today, wind turbines turn it into electricity without polluting the
      air, and because the wind will never run out, it is renewable.
  - title: Please – No More Wind Farms!
    kind: Persuasive article
    pages: "133–135"
    summary: >-
      This writer takes the opposite view. Wind turbines can harm birds and bats, spoil the landscape, and only work when
      the wind blows, so they are not always reliable. The writer uses strong, emotive words to persuade us that no more
      wind farms should be built.
  - title: Renewable Sources of Energy – The Way Forward
    kind: Persuasive article
    pages: "141–146"
    summary: >-
      This article looks at several renewable sources of energy, including geothermal, biomass, hydroelectric and solar
      power, and weighs up their advantages and disadvantages. The writer's aim is to persuade us that solar energy is the
      best choice, because it is clean, increasingly affordable, portable and available to people almost everywhere.
vocab:
  - word: renewable
    meaning: Able to be replaced naturally, so it will not run out.
    example: Wind and sunlight are renewable sources of energy.
  - word: fossil fuels
    meaning: Fuels such as coal, oil and gas, formed underground over millions of years. They will run out.
    example: Burning fossil fuels releases carbon dioxide.
  - word: wind turbine
    meaning: A tall machine with large blades that turns the energy of the wind into electricity.
    example: The wind turbine's blades turned slowly in the breeze.
  - word: persuasive
    meaning: Trying to make someone agree with an opinion or do something.
    example: Her persuasive speech made everyone want to recycle.
  - word: rhetorical question
    meaning: A question asked for effect, not because the writer expects an answer.
    example: "'Who wouldn't want clean air?' is a rhetorical question."
  - word: emotive language
    meaning: Words chosen to make the reader feel strong emotions.
    example: "Calling turbines 'monstrosities' is emotive language."
  - word: geothermal
    meaning: Heat from deep inside the Earth.
    example: Iceland uses geothermal energy to heat many homes.
  - word: hydroelectric
    meaning: Electricity made from the power of moving water.
    example: The dam powers a hydroelectric power station.
  - word: indirect speech
    meaning: Reporting what someone said or asked without using their exact words.
    example: She asked whether the wind farm was finished.
  - word: determiner
    meaning: A word that comes before a noun to show which one or how many, such as the, a, some or this.
    example: "In 'some panels', 'some' is a determiner."
