cards:
  - front: What does King Lear ask his daughters to do?
    back: To say how much they love him, so that he can divide his kingdom among them.
  - front: Why is Cordelia given nothing?
    back: She refuses to flatter her father and simply tells the truth, which makes Lear furious.
  - front: What happens to the Earl of Kent?
    back: He speaks up for Cordelia, and Lear banishes him.
  - front: What is an aside?
    back: Words a character says to the audience that the other characters on stage cannot hear.
  - front: Why is Yusuf's climb on Jabal Sawda so important to him?
    back: His father died in a climbing accident there, and Yusuf has to face his fears and his feelings about it.
  - front: Which prefix goes before roots starting with l, m or p, and r?
    back: il- before l (illegal), im- before m or p (immortal, impossible), ir- before r (irregular).
  - front: What is the difference between hyperbole and a euphemism?
    back: Hyperbole exaggerates. A euphemism says something unpleasant in a gentle way.
practice:
  - q: What are stage directions?
    options: ["The lines characters say", "Instructions for how actors move and speak", "The title of the play", "The list of characters"]
    answer: 1
    explain: Stage directions tell actors what to do and how to do it.
  - q: Which sentence is passive?
    options: ["Lear banished Kent.", "Kent was banished by Lear.", "Kent spoke bravely.", "Cordelia told the truth."]
    answer: 1
    explain: "'was banished' is a form of 'be' plus a past participle."
  - q: Which daughter refuses to flatter King Lear?
    options: ["Goneril", "Regan", "Cordelia", "All three"]
    answer: 2
    explain: Cordelia tells the truth instead of flattering him.
  - q: Which word means 'not legal'?
    options: ["unlegal", "illegal", "dislegal", "irlegal"]
    answer: 1
    explain: We use il- before words that start with l.
  - q: "What does 'a wild goose chase' mean?"
    options: ["A race between birds", "A hopeless search for something you will not find", "A farm job", "A fast game"]
    answer: 1
    explain: It means a long, useless search.
  - q: Which is a euphemism?
    options: ["He passed away.", "It weighs a ton!", "I'm so hungry I could eat a horse.", "That's a rock-solid plan."]
    answer: 0
    explain: "'Passed away' is a gentle way of saying 'died'."
  - q: Why does Yusuf feel bad at the start of the climb?
    options: ["He has lost his rope", "He has not told his mother about the climb", "He is late for school", "He does not like Salman"]
    answer: 1
    explain: Yusuf feels bad about not telling his mother.
  - q: What is an aside?
    options: ["A long speech to other characters", "Words spoken to the audience that other characters cannot hear", "A scene change", "A song"]
    answer: 1
    explain: An aside shares a character's private thoughts with the audience.
