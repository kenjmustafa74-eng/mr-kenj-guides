grammar:
  - title: Active and passive verb forms
    lesson: "Lesson 4 · Language Focus – Grammar"
    pages: "209–210"
    wb: "138"
    intro: >-
      You met the passive voice back in Unit 2. Now let's take it further. Playwrights and writers switch between active
      and passive to decide what the audience should notice first. You can do the same!
    points:
      - "In the **active voice**, the subject does the action: 'Lear **banished** Kent.'"
      - "In the **passive voice**, the subject receives the action: 'Kent **was banished** by Lear.'"
      - "Form the passive with **be** in the right tense + the **past participle**: is made, was made, will be made."
      - "The passive puts the **focus** on the person or thing affected, or hides who did the action."
    examples:
      - text: "The courtiers **entertained** the king. → The king **was entertained** by the courtiers."
        note: "The focus moves to the king."
      - text: "The seamstresses **make** the robes. → The robes **are made** by the seamstresses."
        note: "Present tense in both."
      - text: "The rope **is pulled** firmly to test the knot."
        note: "The focus is on the rope; we do not need to say who pulled it."
    tip: "When you change a sentence, keep the tense the same: 'will banish' becomes 'will be banished'."
    practice:
      - q: "Change to the passive: 'Lear will banish Kent.'"
        options: ["Kent banished Lear.", "Kent will be banished by Lear.", "Kent is banishing Lear.", "Kent was banish by Lear."]
        answer: 1
        explain: "Future passive: will be + past participle."
      - q: "Change to the active: 'The play was watched by many people.'"
        options: ["Many people watched the play.", "The play watched many people.", "Many people were watched.", "The play is watching."]
        answer: 0
        explain: "The doers, 'many people', become the subject."
      - q: "Which sentence is active?"
        options: ["Cordelia was punished.", "The kingdom was divided.", "Kent spoke the truth.", "The crown is worn by Lear."]
        answer: 2
        explain: "Kent is the subject and does the action."
      - q: "Which is the correct passive form? 'The robes ___ by the seamstresses last year.'"
        options: ["are made", "were made", "will be made", "make"]
        answer: 1
        explain: "'Last year' needs the past: were made."
      - q: "Why might a writer use the passive?"
        options: ["To focus on the person or thing affected by the action", "To add a rhyme", "To ask a question", "To show the future only"]
        answer: 0
        explain: "The passive moves the focus to the receiver of the action."
  - title: Prefixes that create antonyms
    lesson: "Lesson 12 · Language Focus"
    pages: "220"
    wb: "145"
    intro: >-
      Here is a quick way to double your vocabulary: add a prefix and you have an opposite! Learn a few simple rules and
      you will choose the right prefix every time.
    points:
      - "**un-**, **dis-** and **mis-** create opposites: unhappy, dishonest, misunderstand."
      - "**il-** is used before words beginning with **l**: illegal, illogical."
      - "**im-** is used before words beginning with **m** or **p**: immortal, impossible."
      - "**ir-** is used before words beginning with **r**: irregular, irrelevant."
      - "**mis-** often means 'wrongly' or 'badly': misbehave, misprint."
    examples:
      - text: "Lear thought Cordelia was **un**grateful."
        note: "un- + grateful."
      - text: "Climbing alone at night would be **ir**responsible."
        note: "ir- before r."
      - text: "Kent **dis**obeyed the king's order to stay silent."
        note: "dis- + obey."
    tip: "Keep both letters when a prefix meets the same letter: il + legal = illegal, mis + spell = misspell."
    practice:
      - q: "Which is the antonym of 'possible'?"
        options: ["unpossible", "impossible", "dispossible", "irpossible"]
        answer: 1
        explain: "We use im- before p."
      - q: "Which is the antonym of 'regular'?"
        options: ["irregular", "unregular", "disregular", "imregular"]
        answer: 0
        explain: "We use ir- before r."
      - q: "Which is the antonym of 'logical'?"
        options: ["unlogical", "illogical", "dislogical", "mislogical"]
        answer: 1
        explain: "We use il- before l."
      - q: "What does 'misquote' mean?"
        options: ["to quote correctly", "to quote wrongly", "to refuse to quote", "to quote twice"]
        answer: 1
        explain: "mis- means wrongly."
      - q: "Which word is spelt correctly?"
        options: ["mispell", "misspell", "missspell", "misppell"]
        answer: 1
        explain: "mis + spell = misspell. Keep the s from mis- and the s from spell."
