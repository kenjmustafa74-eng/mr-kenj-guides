parts:
  - code: 9A
    title: Shakespeare's World
  - code: 9B
    title: Modern Worlds
overview: >-
  Lights up, curtain up! In our final unit you will read two play scripts. The first is an adapted scene from
  Shakespeare's King Lear, in which an ageing king asks his daughters to say how much they love him, with dramatic
  results. The second is a modern play about a brave young climber called Yusuf. You will learn the features of play
  scripts, use active and passive verb forms, explore Shakespeare's famous phrases, and finally write a play script of
  your own.
objectives:
  - Identify the features of play scripts, including the cast list, stage directions, acts, scenes, asides and monologues.
  - Use active and passive verb forms, and explain how the passive changes the focus of a sentence.
  - Explain the meanings of figurative phrases that Shakespeare made famous.
  - Apply spelling rules, and use prefixes that create antonyms (un-, dis-, mis-, im-, il-, ir-).
  - Compare and contrast two play scripts, including their themes and conflicts.
  - Recognise hyperbole, euphemism and puns.
  - Listen to a play, and write character and setting descriptions, stage directions and a play script.
texts:
  - title: King Lear (adapted)
    kind: Play script by William Shakespeare (adapted)
    pages: "206–213"
    summary: >-
      King Lear decides to divide his kingdom among his three daughters and asks each one to say how much she loves him.
      Goneril and Regan flatter him with grand speeches, but his youngest daughter, Cordelia, refuses to exaggerate and
      simply tells the truth. Furious, Lear gives her nothing, and when the loyal Earl of Kent speaks up for her, Lear
      banishes him too. The scene explores truth and flattery, and wise and unwise decisions.
  - title: A Boy Called Everest
    kind: Modern play script
    pages: "218–223"
    summary: >-
      Yusuf, a talented young climber nicknamed Everest, and his friend Salman set out to climb a rockface on the
      mountain Jabal Sawda, where Yusuf's father died in a climbing accident. Yusuf has not told his mother, who does not
      want him to climb. On the mountain, the boys find an injured man and must decide how to help him, and Yusuf has to
      face his fears.
  - title: A Boy Called Everest (Act 2 Scene 2)
    kind: Listening text (play script)
    pages: "225"
    summary: >-
      The final part of the play, in which the boys look for help on the mountain and the conflicts in the story are
      resolved.
vocab:
  - word: play script
    meaning: The written text of a play, with the characters' lines and stage directions.
    example: We read the play script aloud in groups.
  - word: cast list
    meaning: The list of characters at the start of a play script.
    example: The cast list shows that Cordelia is Lear's youngest daughter.
  - word: stage directions
    meaning: Instructions in a play script that tell the actors how to move, speak or act.
    example: "The stage direction said: (walking slowly to centre stage)."
  - word: aside
    meaning: Words a character says to the audience that the other characters cannot hear.
    example: Cordelia's aside shows us her true feelings.
  - word: monologue
    meaning: A long speech by one character.
    example: Cordelia's monologue explains why she will not flatter her father.
  - word: banish
    meaning: To send someone away from a place as a punishment.
    example: Lear banished Kent from the kingdom.
  - word: flattery
    meaning: Praise that is too much and not sincere, often given to win favour.
    example: Goneril's speech was full of flattery.
  - word: hyperbole
    meaning: Extreme exaggeration used for effect.
    example: "'I've told you a million times!' is hyperbole."
  - word: euphemism
    meaning: A gentle or polite way of saying something unpleasant.
    example: "'Passed away' is a euphemism for 'died'."
  - word: pun
    meaning: A joke that plays on a word with two meanings or words that sound alike.
    example: "Climbers love rock-solid friends! That is a pun."
