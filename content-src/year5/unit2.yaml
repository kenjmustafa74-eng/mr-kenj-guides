  - code: 2G
    title: "Let's Learn: Sources of information"
    pages: "26–27"
    steps:
      - "Question 1: name each type of source, such as a family tree, map, timeline, interview or letter."
      - "Question 2: use the information from the sources to write a paragraph about the person."
    tip: Combine facts from all the sources, then put them in a sensible order.
  - code: 2H
    title: "Language Focus: Comparative and superlative adjectives and adverbs"
    pages: "28"
    steps:
      - "Question 1: fill in the correct comparative or superlative form."
      - "Question 2: write your own sentences using comparatives and superlatives."
    tip: For short words, add '-er' or '-est'. For longer words, use 'more' or 'most'.
  - code: 2I
    title: "Reading Comprehension: Women Who Mattered and A Woman of Vision"
    pages: "29–30"
    steps:
