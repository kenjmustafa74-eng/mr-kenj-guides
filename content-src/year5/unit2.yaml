cards:
  - front: What are the usual parts of a biography?
    back: Introduction, early life, later life, achievements and legacy.
  - front: Which tense and viewpoint does a biography use?
    back: The past tense and the third person ('he', 'she', 'they').
  - front: What was 'The Greatest Show on Earth'?
    back: P.T. Barnum's enormous travelling circus, which moved from town to town by train.
  - front: Why is Wangari Maathai remembered?
    back: She encouraged people to plant trees to protect the environment, and she was the first African woman to win the Nobel Peace Prize.
  - front: Name four sources of information a biographer might use.
    back: For example, family trees, maps, timelines, interviews and letters.
  - front: When do you use 'more' and 'most' instead of '-er' and '-est'?
    back: With most longer words, for example 'more powerful' and 'most diligent'.
practice:
  - q: A biography is...
    options: ["a made-up story about animals", "the true story of a person's life written by someone else", "a poem about nature", "a list of instructions"]
    answer: 1
    explain: A biography tells the true story of a real person's life.
  - q: Which tense are most biographies written in?
    options: ["Future tense", "Present tense", "Past tense", "No tense"]
    answer: 2
    explain: Biographies describe events that have already happened, so they use the past tense.
  - q: "What is a person's 'legacy'?"
    options: ["Their favourite food", "Something important they leave behind for the world", "Their home address", "Their first job"]
    answer: 1
    explain: A legacy is the lasting difference a person makes.
  - q: Which modal verb shows that something is only possible, not certain?
    options: ["must", "will", "might", "shall"]
    answer: 2
    explain: "'Might' shows that something is possible, but not certain."
  - q: Which prefix makes the opposite of 'visible'?
    options: ["un-", "in-", "dis-", "re-"]
    answer: 1
    explain: "'Invisible' means not able to be seen."
  - q: Choose the correct superlative.
    options: ["Jumbo was the most big elephant.", "Jumbo was the bigger elephant of all.", "Jumbo was the biggest elephant of all.", "Jumbo was the more biggest elephant."]
    answer: 2
    explain: "'Big' is a short word, so we add '-est' and double the final 'g': 'biggest'."
  - q: How many syllables are there in 'entertainment'?
    options: ["Two", "Three", "Four", "Five"]
    answer: 2
    explain: "en / ter / tain / ment has four syllables."
  - q: What did Wang Zhenyi study, even though girls could not go to school?
    options: ["Cooking", "Astronomy", "Football", "Music only"]
    answer: 1
    explain: She taught herself astronomy and mathematics and explained eclipses.
