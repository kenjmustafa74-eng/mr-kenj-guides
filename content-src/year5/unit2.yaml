  - code: 2L
    title: What Have I Learnt?
    pages: "33"
    steps:
      - "Question 1: review the features of biographies."
      - "Question 2: fill the gaps in the text."
      - "Question 3: find the language features you have learnt in this unit."
    tip: Look back at the Language Focus pages if you get stuck.
  - code: J
    title: My Journal
    pages: "34"
