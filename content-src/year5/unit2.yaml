    wrong: [run, happy, quickly, table, sing, under, tall, jump]
  - prompt: Catch the words that use a prefix or suffix to make an opposite
    correct: [unfair, invisible, impossible, disagree, fearless, careless, unusual, hopeless]
    wrong: [happy, careful, visible, agree, possible, usual, hopeful, fair]
