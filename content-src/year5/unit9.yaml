cards:
  - front: What does a persuasive commentary do?
    back: It highlights a problem, gives accurate information, suggests a solution and tries to convince the reader.
  - front: Formal or informal? 'Hi there, buddy! Want to try packed lunches with me?'
    back: Informal. It uses a chatty greeting and a short, friendly question.
  - front: Why do languages disappear?
    back: For example, parents want children to learn a dominant language for jobs, and some societies have stopped people using their own languages.
  - front: Why is plastic dangerous for sea creatures?
    back: It does not decompose naturally. It breaks into microplastics that animals swallow and that can clog their digestive systems.
  - front: Name three persuasive phrases.
    back: For example, 'I strongly believe', 'It is vital that' and 'Surely everyone agrees'.
  - front: Which relative pronoun shows ownership?
    back: "'Whose', for example 'The student whose family is from Korea won the quiz.'"
practice:
  - q: What is the main purpose of a persuasive text?
    options: ["To entertain with a story", "To convince the reader to agree or act", "To give instructions", "To describe a person's life"]
    answer: 1
    explain: Persuasive texts try to change what the reader thinks or does.
  - q: Which sentence is formal?
    options: ["Hey, wanna come?", "That's gr8!", "I am writing to express my concern.", "No way, mate!"]
    answer: 2
    explain: Formal language uses full words and no slang.
  - q: Which is a persuasive phrase?
    options: ["Once upon a time", "It is vital that we act now", "First, mix the flour", "The end"]
    answer: 1
    explain: "'It is vital that' sounds urgent and confident."
  - q: Choose the correct relative pronoun. 'The app ___ helps you learn Japanese is fun.'
    options: ["who", "that", "whose", "whom"]
    answer: 1
    explain: "We use 'that' or 'which' for things."
  - q: What does 'single-use' mean?
    options: ["Used only once and then thrown away", "Used by one person", "Very strong", "Made of metal"]
    answer: 0
    explain: Single-use items are thrown away after one use.
  - q: Add a suffix to 'hope' to mean 'without hope'.
    options: ["hopeful", "hoping", "hopeless", "hoped"]
    answer: 2
    explain: "The suffix '-less' means 'without'."
  - q: Which word helps to organise an argument in order?
    options: ["Firstly", "Quickly", "Loudly", "Yesterday"]
    answer: 0
    explain: "'Firstly' introduces the first point in a sequence."
  - q: In 'Danger in Our Oceans', what are microplastics?
    options: ["Very small fish", "Tiny pieces of broken-down plastic", "A type of seaweed", "Plastic bottles"]
    answer: 1
    explain: Microplastics are tiny pieces that come from larger plastic breaking down.
