id: 9
title: The Art of Persuasion
icon: "📣"
colour: "#7a5c2e"
sbStart: 219
wbStart: 136
sbPages: "219–245"
wbPages: "136–153"
parts:
  - code: 9A
    title: "It's Compelling!"
  - code: 9B
    title: Convince Me
overview: >-
  How do you change someone's mind? In this unit you will read persuasive commentaries about languages that are
  disappearing, a persuasive article about plastic in our oceans, and letters written to convince people to act.
  You will learn the tricks that persuasive writers use and write a persuasive letter of your own.
objectives:
  - Identify the features of a persuasive commentary and a persuasive letter.
  - Use persuasive words and phrases to express opinions and give reasons.
  - Use relative pronouns and relative clauses to add information.
  - Choose between formal and informal register for different audiences.
  - Add suffixes to root words to make new words.
  - Use adverbs and adverbial phrases to link ideas, and write a persuasive letter.
texts:
  - title: Disappearing Languages
    kind: Persuasive commentary
    pages: "222–224"
    summary: >-
      About 7,000 languages are spoken in the world today, but around half of them could disappear. The writer
      explains why this happens and why it matters: languages carry special knowledge about places, nature and
      culture. The commentary asks questions, gives answers and suggests ways to save these languages.
  - title: The Basque Language Revival
    kind: Persuasive commentary
    pages: "226–228"
    summary: >-
      Basque is a very old language spoken in a region of Spain and France. It was once discouraged, but people
      kept it alive through conversation, songs and poems. Today it is taught from preschool to university, and
      technology and games help young people to use it. The writer calls this work a shining example.
  - title: Danger in Our Oceans
    kind: Persuasive article
    pages: "235–236"
    summary: >-
      Plastic is made of strong chains of molecules, so it takes a very long time to break down. Instead, it breaks
      into tiny pieces called microplastics, which harm sea creatures and can even end up in our food. The writer
      argues that we all need to take responsibility.
  - title: Letters to Convince You
    kind: A persuasive email and a persuasive letter
    pages: "238–240"
    summary: >-
      Two young writers try to persuade others to cut down on single-use plastic. One writes a formal email asking
      for reusable cups instead of plastic ones. The other writes a chatty, informal letter to a friend, suggesting
      packed lunches in reusable containers instead of fast-food packaging.
vocab:
  - word: persuade
    meaning: To make someone agree with you or do something by giving them good reasons.
    example: She persuaded the class to recycle more.
  - word: commentary
    meaning: A piece of writing that gives the writer's opinion and explanation about an issue.
    example: The commentary argued that we should save small languages.
  - word: opinion
    meaning: What someone thinks or believes about something.
    example: In my opinion, every school should have recycling bins.
  - word: register
    meaning: How formal or informal language is, depending on who you are talking or writing to.
    example: Use a formal register in a letter to the head teacher.
  - word: dominant
    meaning: The most powerful or important.
    example: A dominant language can take over smaller ones.
  - word: indigenous
    meaning: Belonging to a place from the very beginning, before others arrived.
    example: Basque is an indigenous language of the region.
  - word: single-use
    meaning: Made to be used only once and then thrown away.
    example: Single-use plastic cups cause pollution.
  - word: decompose
    meaning: To break down naturally over time.
    example: Leaves decompose, but plastic takes hundreds of years.
  - word: microplastics
    meaning: Tiny pieces of plastic that come from larger plastic breaking down.
    example: Fish can swallow microplastics.
  - word: debris
    meaning: Scattered rubbish or broken pieces.
    example: Plastic debris washed up on the beach.
