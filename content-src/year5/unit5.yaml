cards:
  - front: What is the difference between a fact and an opinion?
    back: A fact can be checked and proved. An opinion is what someone thinks or feels.
  - front: Why do snakes bask in the sun?
    back: They are cold-blooded, so they get their warmth from their surroundings.
  - front: What does 'tone' mean in writing?
    back: The feeling or attitude of a text, for example serious, formal, light-hearted or funny.
  - front: Adverbs of time and frequency answer which questions?
    back: Time answers 'When?' (yesterday). Frequency answers 'How often?' (sometimes).
  - front: Adverbs of place and manner answer which questions?
    back: Place answers 'Where?' (along the ocean floor). Manner answers 'How?' (stealthily).
  - front: Why does the writer say that venomous sea creatures should be protected?
    back: Because they play a part in keeping the environment in balance.
practice:
  - q: Which sentence is an opinion?
    options: ["Box jellyfish live in the ocean.", "Snakes are cold-blooded.", "Sharks are the most amazing creatures ever.", "Cone snails hunt their prey."]
    answer: 2
    explain: "'Most amazing' shows what the writer thinks, so it is an opinion."
  - q: "'Occasionally, snakes are active at night.' What kind of adverb is 'occasionally'?"
    options: ["Place", "Manner", "Frequency", "Time"]
    answer: 2
    explain: It tells you how often, so it is an adverb of frequency.
  - q: "'The cone snail moved stealthily.' What kind of adverb is 'stealthily'?"
    options: ["Manner", "Place", "Time", "Frequency"]
    answer: 0
    explain: It tells you HOW the snail moved, so it is an adverb of manner.
  - q: Which word is the strongest?
    options: ["tired", "sleepy", "exhausted", "fatigued"]
    answer: 2
    explain: "'Exhausted' is the strongest shade of meaning."
  - q: Which modal verb shows the most certainty?
    options: ["might", "could", "will", "may"]
    answer: 2
    explain: "'Will' shows that something is certain to happen."
  - q: Which word has a silent vowel when we say it?
    options: ["cat", "chocolate", "dog", "sun"]
    answer: 1
    explain: Most people say 'choc-late', so the second 'o' is not heard.
  - q: What is a predator?
    options: ["An animal that is hunted", "An animal that hunts other animals", "A plant", "A type of shell"]
    answer: 1
    explain: A predator hunts and eats other animals, which are its prey.
  - q: "'The snake shed its scales.' Which meaning of 'scales' is used here?"
    options: ["A machine for weighing", "Small flat plates covering the skin", "Musical notes going up and down", "Sizes on a map"]
    answer: 1
    explain: The context (snake, shed) tells us that scales are the plates on its skin.
basket:
