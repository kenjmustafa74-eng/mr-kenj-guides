parts:
  - code: 5A
    title: Venomous Creatures
  - code: 5B
    title: Beware of These Creatures!
overview: >-
  Snakes, jellyfish and cone snails all belong to 'The Venom Club'! In this unit you will read magazine-style
  information texts about venomous creatures on land and in the sea. You will learn how writers choose their tone,
  how to tell facts from opinions, and how to write a gripping article about a dangerous animal.
objectives:
  - Explain the purpose and tone of information texts, and how tone can be serious or light-hearted.
  - Tell the difference between facts and opinions in articles.
  - Use adverbs and adverbial phrases of time, frequency, place and manner.
  - Use modal verbs to show how possible something is.
  - Work out the meaning of homonyms from context, and spot silent vowels in words.
  - Choose words with the right shade of meaning, and write an article about a dangerous animal.
texts:
  - title: "The Venom Club – Venomous Land Creatures"
    kind: Information text (magazine article)
    pages: "111–116"
    summary: >-
      This lively article is about venomous snakes. It explains that snakes are cold-blooded and get their warmth
      from their surroundings, and it describes their 'super skills' under fun subheadings such as Strong Scales,
      Stealth and Super Senses. There are about 3,500 known species of snake, but only a small number can seriously
      harm people.
  - title: "The Venom Club – Venomous Sea Creatures"
    kind: Information text (magazine article)
    pages: "123–129"
    summary: >-
      This part of the article dives into the ocean to meet the box jellyfish, which has a body shape unlike other
      jellyfish, and the cone snail, a highly skilled hunter. The writer argues that, although these creatures are
      dangerous, they are also valuable and need to be protected.
vocab:
  - word: venomous
    meaning: Able to inject a poison (venom) by biting or stinging.
    example: A cone snail is venomous.
  - word: predator
    meaning: An animal that hunts and eats other animals.
    example: The snake is the predator and the frog is its prey.
  - word: prey
    meaning: An animal that is hunted and eaten by another animal.
    example: Mice are prey for many snakes.
  - word: cold-blooded
    meaning: Having a body temperature that changes with the temperature around it.
    example: Snakes are cold-blooded, so they bask in the sun.
  - word: tone
    meaning: The feeling or attitude that a piece of writing shows, for example serious or light-hearted.
    example: The article has a fun, light-hearted tone.
  - word: fact
    meaning: Something that can be checked and proved to be true.
    example: Box jellyfish live in the ocean.
  - word: opinion
    meaning: What someone thinks or believes. It cannot be proved.
    example: I think box jellyfish are amazing.
  - word: homonym
    meaning: A word that is spelt and said the same as another word but has a different meaning.
    example: "'Scales' can be the plates on a snake's skin or a machine for weighing."
  - word: conserve
    meaning: To protect something so that it is not damaged or lost.
    example: We must conserve ocean creatures.
  - word: ambush
    meaning: To hide and then attack suddenly.
    example: Many snakes ambush their prey.
