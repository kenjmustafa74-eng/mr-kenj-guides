  - part: 6A
    lesson: Lesson 4
    title: "Language Focus – Grammar: Direct and reported speech"
    pages: "141–143"
    tip: In reported speech, the tense moves back, pronouns change and there are no inverted commas.
  - part: 6A
    lesson: Lessons 5–6
    title: "Reading Part 2: Oliver Twist – The Workhouse and Reading Comprehension"
    pages: "144–145"
