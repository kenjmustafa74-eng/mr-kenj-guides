cards:
  - front: What makes a book a classic?
    back: It was written some time ago, it is very well written, and its characters and ideas still matter to readers today.
  - front: Who wrote Oliver Twist?
    back: Charles Dickens.
  - front: Why does Oliver get into trouble in the workhouse?
    back: He asks for more food, and the people in charge are shocked.
  - front: "Change to reported speech: 'I am hungry,' said Oliver."
    back: Oliver said that he was hungry.
  - front: "'The boy's bowls' or 'the boys' bowls'?"
    back: "'The boy's bowls' belong to one boy. 'The boys' bowls' belong to more than one boy."
  - front: How can you tell a story is in the first person?
    back: The narrator uses 'I' and 'me' and tells their own story.
practice:
  - q: Which sentence is reported speech?
    options: ["\"I want some more,\" said Oliver.", "Oliver said that he wanted some more.", "\"More!\" shouted Oliver.", "Oliver: I want more."]
    answer: 1
    explain: Reported speech tells us what was said without the exact words or inverted commas.
  - q: Which sentence is punctuated correctly?
    options: ["\"Please, sir, I want some more\" said Oliver.", "\"Please, sir, I want some more,\" said Oliver.", "\"Please, sir, I want some more\", said Oliver.", "Please, sir, I want some more, said Oliver."]
    answer: 1
    explain: The comma goes inside the inverted commas, before 'said'.
  - q: Which word follows the rule 'i before e except after c'?
    options: ["recieve", "receive", "beleive", "peice"]
    answer: 1
    explain: After 'c', we write 'ei', so 'receive' is correct.
  - q: Which is a possessive pronoun?
    options: ["he", "they", "ours", "we"]
    answer: 2
    explain: "'Ours' shows that something belongs to us."
  - q: Which sentence uses the apostrophe correctly?
    options: ["The dog wagged it's tail.", "The dog wagged its tail.", "The dog wagged its' tail.", "The dogs' wagged its tail."]
    answer: 1
    explain: "'Its' shows possession and never has an apostrophe. 'It's' means 'it is'."
  - q: "'I walked to London and my feet were bleeding.' Which viewpoint is this?"
    options: ["First person", "Second person", "Third person", "No viewpoint"]
    answer: 0
    explain: The narrator uses 'I' and 'my', so it is the first person.
  - q: Who buys Oliver food and offers to take him to London?
    options: ["Mr Bumble", "The Artful Dodger", "The master", "The gentleman at the bookstall"]
    answer: 1
    explain: The Artful Dodger buys Oliver food and offers to take him to a man in London.
  - q: What is the contraction of 'they have'?
    options: ["they'v", "theyve", "they've", "the've"]
    answer: 2
    explain: The apostrophe replaces the missing letters 'ha'.
