  - part: 6B
    lesson: Lesson 11
    title: "Reading Part 1: Oliver Twist – The Artful Dodger"
    pages: "151–152"
    tip: What clues tell you how far Oliver has walked and how he feels?
  - part: 6B
    lesson: Lesson 12
    title: "Language Focus – Grammar: Personal and possessive pronouns"
    pages: "153–154"
    tip: Personal pronouns replace names (he, they). Possessive pronouns show ownership (mine, ours).
  - part: 6B
    lesson: Lesson 13
    title: "Reading Part 2: Oliver Twist – Oliver Got Caught! and Reading Comprehension"
    pages: "155–157"
    tip: Why does Oliver run, and why does the crowd think he is the thief?
  - part: 6B
    lesson: Lesson 14
    title: "Language Focus – Punctuation: Apostrophes"
    pages: "158"
    tip: For one owner, add 's (the boy's). For plural owners ending in s, add just the apostrophe (the boys').
  - part: 6B
    lesson: Lesson 15
    title: "Speaking: Acting out a scene"
    pages: "159"
    tip: Use your voice, face and body to show how your character feels.
  - part: 6B
    lesson: Lessons 16–17
    title: "Writing: A diary entry to express a viewpoint"
    pages: "160–161"
    tip: Write as Oliver in the first person. Include the date, what happened and how you felt.
  - part: 6B
    lesson: Lesson 18
    title: Unit Self-reflection
    pages: "162"
    tip: Would you like to read the whole of Oliver Twist one day? Why?
