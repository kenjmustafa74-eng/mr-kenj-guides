  - part: 6A
    lesson: Lesson 1
    title: Be Curious
    pages: "136"
    tip: Talk about the difference between 'classic' and 'modern'. What classic things can you think of?
  - part: 6A
    lesson: Lesson 2
    title: "Getting Started and Let's Learn: What makes literature a classic?"
    pages: "137–138"
    tip: Classics were written long ago, are very well written and have ideas that still matter to readers today.
