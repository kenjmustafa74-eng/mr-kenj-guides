    tip: Put the spoken words and their punctuation inside the inverted commas.
  - part: 6A
    lesson: Lesson 8
    title: "Word Structure: Spelling rules"
    pages: "147"
    tip: Revise 'i before e except after c', dropping the silent 'e', doubling consonants, changing 'y' to 'i', and 'ck' and 'tch'.
  - part: 6A
    lesson: Lesson 9
    title: "Writing: A classic in modern language"
    pages: "148"
