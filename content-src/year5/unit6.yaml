id: 6
title: What a Classic!
icon: "🎩"
colour: "#8c3b3b"
sbStart: 136
wbStart: 85
sbPages: "136–162"
wbPages: "85–101"
parts:
  - code: 6A
    title: A Classic Novel
  - code: 6B
    title: What's the Angle?
overview: >-
  Why do people still read stories that were written nearly 200 years ago? In this unit you will read extracts from
  Charles Dickens's famous novel Oliver Twist. You will learn what makes a book a 'classic', how stories can be
  told from different viewpoints, and how to write direct and reported speech correctly.
objectives:
  - Explain what makes literature a classic.
  - Identify first-person and third-person viewpoints in stories.
  - Change direct speech into reported speech, and punctuate both correctly.
  - Use personal and possessive pronouns correctly.
  - Use apostrophes for possession and for contractions.
  - Apply spelling rules, such as 'i before e except after c', and write a diary entry from a character's viewpoint.
texts:
  - title: "Oliver Twist: The Workhouse"
    kind: Extract from a classic novel by Charles Dickens
    pages: "139–145"
    summary: >-
      Oliver is an orphan who lives in a workhouse, where the boys are given only a small bowl of thin porridge
      called gruel. The hungry boys decide that someone must ask for more, and Oliver is chosen. When he walks up
      to the master and asks for more, the adults are shocked, and Oliver is treated as if he has committed a crime.
  - title: "Oliver Twist: The Artful Dodger"
    kind: Extract from a classic novel by Charles Dickens
    pages: "151–152"
    summary: >-
      After a week of walking, a tired and hungry Oliver reaches a small town on the way to London. There he meets a confident boy
      called the Artful Dodger, who buys him food and offers to take him to a man in London who will give him
      somewhere to sleep.
  - title: "Oliver Twist: Oliver Got Caught!"
    kind: Extract from a classic novel by Charles Dickens
    pages: "155–157"
    summary: >-
      Oliver watches in horror as the Dodger steals a gentleman's handkerchief at a bookstall. Confused and
      frightened, Oliver runs away, so the crowd chases him, shouting 'Stop, thief!' Oliver is blamed for a crime
      that he did not commit.
vocab:
  - word: classic
    meaning: A book that has been admired for a long time because it is very well written and its ideas still matter today.
    example: Oliver Twist is a classic novel.
  - word: workhouse
    meaning: In the past, a place where very poor people lived and had to work in return for food and a bed.
    example: Oliver grew up in a workhouse.
  - word: gruel
    meaning: A thin, watery porridge.
    example: The boys ate one small bowl of gruel.
  - word: viewpoint
    meaning: The position from which a story is told. In the first person, the narrator says 'I'. In the third person, the narrator says 'he', 'she' or 'they'.
    example: Oliver Twist is told in the third person.
  - word: direct speech
    meaning: The exact words that someone says, written inside inverted commas.
    example: '"I want some more," said Oliver.'
  - word: reported speech
    meaning: Telling what someone said without using their exact words.
    example: Oliver said that he wanted some more.
  - word: possessive pronoun
    meaning: A word that shows who owns something, such as 'mine', 'yours', 'his', 'hers', 'ours' and 'theirs'.
    example: That bowl is mine.
  - word: apostrophe
    meaning: A punctuation mark (’) that shows possession (Oliver's bowl) or missing letters (didn't).
    example: The boy's feet were sore.
  - word: contraction
    meaning: Two words shortened into one, with an apostrophe where the letters are missing.
    example: "'Do not' becomes 'don't'."
  - word: diary entry
    meaning: A personal piece of writing about what happened on a particular day and how the writer felt.
    example: Oliver wrote a diary entry about the day he was blamed.
