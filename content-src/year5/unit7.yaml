      - Write about which play script you preferred, and why.
    tip: Think about the characters, the story and how it would look on stage.
cards:
  - front: Name three features of a play script.
    back: For example, a list of characters, dialogue, stage directions in brackets, and acts and scenes.
  - front: What is an aside?
    back: Words a character says to the audience that the other characters on stage cannot hear.
  - front: What are props?
    back: Objects that actors use on stage, such as bowls, spoons or a lantern.
  - front: When do you use 'whose'?
    back: To show ownership, for example 'The boy whose bowl it was licked it clean.'
  - front: Who frees Sigo from the cave?
    back: Mooinsk, the mother bear, moves the heavy rock.
  - front: What does the root 'tele' mean?
    back: Far, as in 'telephone', 'telescope' and 'television'.
practice:
  - q: In a play script, stage directions are usually written...
    options: ["in inverted commas", "in brackets", "in capital letters only", "at the end of the play"]
    answer: 1
    explain: Stage directions usually go in brackets so that they are not read aloud as dialogue.
  - q: Which relative pronoun completes the sentence? 'The actor ___ played Oliver was brilliant.'
    options: ["which", "who", "whose", "where"]
    answer: 1
    explain: "We use 'who' for people."
  - q: What is an aside?
    options: ["A costume", "A secret comment to the audience", "The end of a play", "A type of scenery"]
    answer: 1
    explain: In an aside, a character speaks to the audience and the other characters do not hear it.
  - q: Which word contains the root 'graph' (writing or drawing)?
    options: ["telephone", "autograph", "biology", "vivid"]
    answer: 1
    explain: An autograph is a person's own signature, so it is a kind of writing.
  - q: "'The cave swallowed the light.' What is this?"
    options: ["Simile", "Personification", "Rhyme", "Stage direction"]
    answer: 1
    explain: The cave is given a human action (swallowing), so it is personification.
  - q: Which sentence is a polite request?
    options: ["Give me that.", "Could I borrow your script, please?", "I will take it.", "You must go."]
    answer: 1
    explain: "'Could I...?' is a polite way to ask."
  - q: Which of these is NOT a feature of a play script?
    options: ["Stage directions", "Chapters", "Acts and scenes", "A list of characters"]
    answer: 1
    explain: Chapters belong to narratives such as novels, not play scripts.
  - q: "'Offstage' means..."
    options: ["in the middle of the stage", "at the side of the stage where the audience cannot see", "in the audience", "on the roof"]
    answer: 1
    explain: Offstage is out of the audience's sight.
basket:
  - prompt: Catch the dramatic conventions
    correct: [dialogue, narrator, aside, costumes, scenery, props, stage lights, sound effects]
    wrong: [glossary, footnote, index, chapter, contents page, timeline, headline, bibliography]
  - prompt: Catch the relative pronouns
    correct: [who, whom, whose, which, that]
    wrong: [and, but, because, when, if, so, or, although]
  - prompt: Catch the words built from the root 'graph' or 'tele'
    correct: [autograph, biography, paragraph, photograph, telephone, telescope, television, geography]
    wrong: [biology, vivid, actor, curtain, stage, music, theatre, audience]
grammar:
  - title: Relative pronouns and relative clauses
    lesson: "Lesson 4 · Language Focus – Grammar"
    pages: "168–169"
    wb: "103"
    intro: >-
      A relative clause lets you add information about a noun without starting a new sentence. It begins with a
      relative pronoun. Play scripts and stage directions use them to describe characters quickly and clearly.
    points:
      - "The relative pronouns are **who** (people), **which** (things and animals), **that** (people or things), **whose** (belonging to) and **where** (places)."
      - "A **relative clause** gives more information about the noun just before it: 'the boy **who asked for more**'."
      - "If the information is extra, put **commas** around the clause: 'Mooin, **who lived with the bears**, was brave.'"
      - "If the information tells us exactly which one we mean, do **not** use commas: 'The girl **who found the cave** was Mooin.'"
    examples:
      - text: "Oliver, **who was very hungry**, walked up to the master."
        note: "Extra information about Oliver, so commas go around it."
      - text: "This is the stage **where the play takes place**."
        note: "'where' introduces a clause about a place."
      - text: "The actor **whose costume was torn** had to change quickly."
        note: "'whose' shows that the costume belonged to the actor."
    practice:
      - q: "Choose the correct relative pronoun: 'The bear ___ looked after Mooin was gentle.'"
        options: ["who", "which", "where", "whose"]
        answer: 1
        explain: "We use 'which' (or 'that') for animals and things."
      - q: "Which relative pronoun shows belonging?"
        options: ["who", "that", "whose", "where"]
        answer: 2
        explain: "'whose' shows that something belongs to someone."
      - q: "Which sentence is punctuated correctly?"
        options: ["Mr Bumble who was the beadle, shouted.", "Mr Bumble, who was the beadle, shouted.", "Mr Bumble, who was the beadle shouted.", "Mr Bumble who, was the beadle shouted."]
        answer: 1
        explain: "The extra information 'who was the beadle' needs a comma on each side."
      - q: "Find the relative clause: 'The village where Mooin lived was near the forest.'"
        options: ["The village", "where Mooin lived", "was near", "near the forest"]
        answer: 1
        explain: "'where Mooin lived' tells us more about the village."
      - q: "Choose the correct word: 'The girl ___ played Nancy was excellent.'"
        options: ["which", "who", "where", "whose"]
        answer: 1
        explain: "We use 'who' for people."
  - title: More about modal verbs
    lesson: "Lesson 14 · Language Focus – Grammar"
    pages: "185"
    wb: "114"
    intro: >-
      You already know that modal verbs show possibility and ability. In plays, characters also use them to give
      advice, ask permission and make polite requests. Choosing the right modal tells the audience a lot about a character.
    points:
      - "To give **advice**, use **should** or **ought to**: 'You **should** rest.'"
      - "To ask for **permission** politely, use **may**, **could** or **can**: '**May** I come in?'"
      - "To make a **polite request**, use **could** or **would**: '**Would** you help me, please?'"
      - "To show something is **necessary**, use **must** or **have to**; to show it is **not necessary**, use **don't have to**; to forbid it, use **mustn't**."
    examples:
      - text: "\"**Could** I have some more, please?\""
        note: "A polite request."
      - text: "\"You **mustn't** go into the forest alone,\" said the chief."
        note: "'mustn't' means it is not allowed."
      - text: "\"You **don't have to** come, but you are welcome.\""
        note: "It is not necessary, but it is allowed."
    practice:
      - q: "Which modal verb gives advice?"
        options: ["should", "may", "will", "can't"]
        answer: 0
        explain: "'should' is used to give advice: 'You should learn your lines.'"
      - q: "Which is the most polite way to ask?"
        options: ["Give me the script.", "Could you give me the script, please?", "You must give me the script.", "I will take the script."]
        answer: 1
        explain: "'Could you … please?' is a polite request."
      - q: "What does 'You mustn't touch the props' mean?"
        options: ["It is not necessary to touch them.", "You are not allowed to touch them.", "You should touch them.", "You might touch them."]
        answer: 1
        explain: "'mustn't' means it is forbidden."
      - q: "Choose the best modal: '___ I leave the room, please?'"
        options: ["Must", "May", "Should", "Would"]
        answer: 1
        explain: "'May I …?' is a polite way to ask for permission."
      - q: "What does 'You don't have to wear a costume' mean?"
        options: ["You are not allowed to wear one.", "It is not necessary to wear one.", "You must wear one.", "You will wear one."]
        answer: 1
        explain: "'don't have to' means it is not necessary, but you may if you want."
