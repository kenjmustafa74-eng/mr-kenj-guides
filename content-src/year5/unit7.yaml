    tip: Look at what the narrative tells you that the play has to show in other ways.
  - code: 7B
    title: "Language Focus: Relative pronouns"
    pages: "103"
    steps:
      - Join the pairs of sentences using a suitable relative pronoun.
    tip: Use commas around a relative clause that adds extra information.
  - code: 7C
    title: "Reading Comprehension: Oliver Twist (play script)"
    pages: "104–105"
    steps:
      - "Question 1: find the answers in the play script and quote from it."
      - "Question 2: rewrite Part 2 as a scene in a story, then give your own opinion about Oliver asking for more food."
    tip: When you change a play into a narrative, turn stage directions into description.
  - code: 7D
    title: "Language Focus: Roots, suffixes and prefixes"
    pages: "106"
    steps:
      - "Question 1: build words using the suffixes."
      - "Question 2: work out the meanings of words from their roots and affixes."
    tip: Check your answers in a dictionary if you have time.
  - code: 7E
    title: "Word Structure: Stressed and unstressed vowel sounds"
    pages: "107"
    steps:
      - "Question 1: underline the stressed vowel sounds and circle the unstressed ones."
      - "Question 2: circle the word parts with an 'ee' sound and underline those with an 'uh' sound."
    tip: Clap the syllables. The stressed syllable is the one you say most strongly.
  - code: 7F
    title: "Writing: Dialogue and stage directions"
    pages: "108"
    steps:
      - Use the template to write the rest of the play.
      - Check that your dialogue is laid out correctly and that the stage directions are in brackets.
    tip: Keep the dialogue short and punchy.
  - code: 7G
    title: "Let's Learn: Dramatic conventions in play scripts"
    pages: "109"
    steps:
      - Complete the paragraphs by filling in the correct dramatic conventions.
    tip: The words you need include 'aside', 'props', 'scenery' and 'sound effects'.
  - code: 7H
    title: "Language Focus: Figurative language"
    pages: "110–111"
    steps:
      - "Question 1: read the text and underline the figurative language."
      - "Question 2: sort the examples into similes and personification."
      - "Question 3: decide what kind of figurative language the final example is."
    tip: Similes use 'like' or 'as'. Personification gives human actions to objects.
  - code: 7I
    title: "Reading Comprehension: Mooin: The Bear's Child"
    pages: "112–113"
    steps:
      - Reread Parts 1 and 2 of the play.
      - Answer the questions, including summarising what happens to the stepfather and how Sigo escapes.
      - Find a synonym, then give your own opinions with reasons.
    tip: Keep your summaries short. Include only the main events.
