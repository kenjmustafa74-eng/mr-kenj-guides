id: 7
title: What an Act!
icon: "🎭"
colour: "#a0522d"
sbStart: 163
wbStart: 102
sbPages: "163–189"
wbPages: "102–119"
parts:
  - code: 7A
    title: Action on Stage
  - code: 7B
    title: Dramatic Flair
overview: >-
  Lights, curtain, action! In this unit you will read play scripts: a short play based on Oliver Twist and a play
  based on a Native American folktale. You will learn how play scripts are different from stories, how writers use
  stage directions and dramatic conventions, and how to write and perform a one-act play of your own.
objectives:
  - Compare play scripts with narratives.
  - Identify dramatic conventions, such as dialogue, a narrator, asides, costumes, scenery, props, lighting and sound effects.
  - Use relative pronouns and relative clauses ('who', 'whom', 'whose', 'which' and 'that').
  - Use roots, prefixes and suffixes to work out word meanings.
  - Spell words with stressed and unstressed vowel sounds.
  - Use figurative language and modal verbs, and write a play script with dialogue and stage directions.
texts:
  - title: Oliver Twist
    kind: Play script based on the classic novel
    pages: "166–171"
    summary: >-
      The workhouse scene from Oliver Twist is turned into a short play. A narrator sets the scene, stage directions
      tell the actors what to do, and the hungry boys push Oliver to ask for more. When he does, Mr Bumble and
      Mr Limbkins are outraged.
  - title: "Mooin: The Bear's Child"
    kind: Play script (adapted from a Native American folktale)
    pages: "177–184"
    summary: >-
      Sigo's cruel stepfather takes him hunting against his mother's wishes, then tricks him into a cave and traps
      him there. Glooscap, the Great Chief, punishes the stepfather and calls the forest animals to help. Only
      Mooinsk, the mother bear, is strong enough to move the rock. Sigo lives with the bears and learns the forest's
      secrets. In the end he returns to his human mother and takes the name Mooin.
vocab:
  - word: play script
    meaning: The written text of a play, with the characters' lines and stage directions.
    example: We read the play script aloud in groups.
  - word: stage directions
    meaning: Instructions in a play script, usually in brackets, that tell actors how to move or speak, or describe lighting and sound.
    example: (Oliver walks slowly to the master.)
  - word: dialogue
    meaning: The words that the characters speak to each other.
    example: The dialogue is short and lively.
  - word: narrator
    meaning: A person who tells the audience what is happening.
    example: The narrator introduces the setting.
  - word: aside
    meaning: Words a character says to the audience that the other characters on stage do not hear.
    example: The stepfather tells the audience his plan in an aside.
  - word: props
    meaning: Objects that actors use on stage.
    example: The bowls and spoons are props.
  - word: scenery
    meaning: The painted background and objects that show where a scene takes place.
    example: The scenery showed a dark forest.
  - word: offstage
    meaning: At the side of the stage, where the audience cannot see.
    example: A loud noise came from offstage.
  - word: relative pronoun
    meaning: A word such as 'who', 'whom', 'whose', 'which' or 'that' that starts a clause giving more information.
    example: The actor who played Oliver was excellent.
  - word: act
    meaning: One of the main parts that a play is divided into. Each act can contain several scenes.
    example: There is a break at the end of Act 1.
