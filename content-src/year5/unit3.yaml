id: 3
title: Poets and Poetry
icon: "🪶"
colour: "#6a4c93"
sbStart: 56
wbStart: 35
sbPages: "56–81"
wbPages: "35–51"
parts:
  - code: 3A
    title: Famous Poets
  - code: 3B
    title: Poems That Tell Stories
overview: >-
  This unit is about poems and the people who write them. You will read funny poems by an English poet and
  thoughtful nature poems by an American poet, then enjoy two poems that tell stories. You will use similes,
  metaphors and personification to write poems of your own.
objectives:
  - Explain the difference between structured verse and free verse.
  - Identify rhyme, rhythm, repetition and stanzas in poems.
  - Recognise and use similes, metaphors and personification.
  - Use degrees of comparison correctly, for example 'sad', 'sadder' and 'saddest'.
  - Spell words with the 'sh' sound written as 'ti', 'ci' and 'ssi'.
  - Use synonyms and antonyms, and write a free verse poem.
texts:
  - title: Poems by a Famous English Poet – Lewis Carroll
    kind: Short biography and poems
    pages: "59–60"
    summary: >-
      Lewis Carroll was an English writer who loved to entertain children with nonsense and humour.
      In 'The Crocodile', a crocodile seems to grin in a friendly way, but he is really welcoming little fishes into
      his jaws. 'The Walrus and the Carpenter' is a funny, rhyming poem about two odd characters walking along a beach.
  - title: Poems by a Famous American Poet – Emily Dickinson
    kind: Short biography and poems
    pages: "62–64"
    summary: >-
      Emily Dickinson (1830–1886) lived a quiet life in America and wrote many poems about nature.
      In 'The Bee Is Not Afraid of Me', nature treats the poet as a friend. 'Autumn' describes the changing season,
      and 'The Butterfly's Day' is written in free verse, with short lines and dashes.
  - title: Stone Soup
    kind: European folktale retold as a narrative poem
    pages: "71–72"
    summary: >-
      A hungry traveller arrives in a village with a big pot and claims he can make soup from a stone. One by one,
      the curious villagers add vegetables and other ingredients, until there is a delicious soup that everyone
      shares. The stone was never magic: it was the sharing that made the soup.
  - title: The Spider and the Fly
    kind: Traditional narrative poem by Mary Howitt
    pages: "74–76"
    summary: >-
      A cunning spider invites a fly into his parlour. At first the fly refuses, but the spider keeps flattering her,
      and in the end she forgets her fear and flies in, with a sad result. The lesson is to beware of people who
      flatter you because they want something.
vocab:
  - word: stanza
    meaning: A group of lines in a poem, like a paragraph in a story.
    example: The poem has four stanzas.
  - word: free verse
    meaning: Poetry that does not follow a fixed pattern of rhyme or rhythm.
    example: '"The Butterfly''s Day" is written in free verse.'
  - word: rhythm
    meaning: The pattern of beats in a line of poetry.
    example: Clap the rhythm as you read the poem aloud.
  - word: simile
    meaning: A comparison that uses 'like' or 'as'.
    example: She danced like a butterfly.
  - word: metaphor
    meaning: A comparison that says something is something else.
    example: My little brother is my alarm clock.
  - word: personification
    meaning: Giving human actions or feelings to something that is not human.
    example: The wind whispered through the trees.
  - word: narrative poem
    meaning: A poem that tells a story, with characters and a plot.
    example: '"Stone Soup" is a narrative poem.'
  - word: flatter
    meaning: To praise someone too much, often to get something from them.
    example: The spider flattered the fly to trick her.
  - word: synonym
    meaning: A word with the same or a similar meaning as another word.
    example: "'Large' is a synonym of 'big'."
  - word: antonym
    meaning: A word with the opposite meaning to another word.
    example: "'Polite' is an antonym of 'rude'."
sb:
  - part: 3A
    lesson: Lesson 1
    title: Be Curious and Getting Started
    pages: "56"
    tip: Talk about how poets and painters are alike. Both create things for other people to enjoy.
  - part: 3A
    lesson: Lesson 2
    title: "Let's Learn: Structured and free verse poems"
    pages: "57–58"
    tip: Structured verse has a pattern of rhyme and rhythm. Free verse is more flexible and sounds more like natural speech.
  - part: 3A
    lesson: Lesson 3
    title: "Reading Part 1: Poems by a Famous English Poet – Lewis Carroll"
    pages: "59–60"
    tip: Read the poems aloud. Find the rhyming words and count the beats in each line.
  - part: 3A
    lesson: Lesson 4
    title: "Language Focus – Grammar: Degrees of comparison"
    pages: "61"
    tip: There are three degrees, for example 'sharp', 'sharper' and 'sharpest'. Only change the word when you are comparing.
  - part: 3A
    lesson: Lessons 5–6
    title: "Reading Part 2: Poems by a Famous American Poet – Emily Dickinson"
    pages: "62–64"
    tip: Look for how the poet makes nature seem alive and friendly. Which poem does not rhyme?
  - part: 3A
    lesson: Lesson 7
    title: "Language Focus – Vocabulary: Similes, metaphors and personification"
    pages: "65–66"
    tip: Similes use 'like' or 'as'. Metaphors say something IS something else. Personification gives human qualities to things.
  - part: 3A
    lesson: Lesson 8
    title: "Word Structure: The 'sh' sound"
    pages: "67"
    tip: The 'sh' sound is often spelt 'ti' (action), 'ci' (special) or 'ssi' (mission).
  - part: 3A
    lesson: Lesson 9
    title: "Writing: Use similes, metaphors and personification in a poem"
    pages: "68"
    tip: Try at least one simile, one metaphor and one example of personification. Read your poem aloud to check how it sounds.
  - part: 3B
