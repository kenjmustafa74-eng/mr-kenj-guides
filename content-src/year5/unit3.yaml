cards:
  - front: What is the difference between structured verse and free verse?
    back: Structured verse follows a pattern of rhyme and rhythm. Free verse has a flexible structure and sounds more like natural speech.
  - front: Simile or metaphor? 'The classroom was a beehive.'
    back: A metaphor. It says the classroom IS a beehive, meaning it was busy and noisy.
  - front: What is personification?
    back: Giving human actions or feelings to something that is not human, for example 'The kettle shrieked'.
  - front: What does the rhyme pattern 'aabb' mean?
    back: Lines rhyme in pairs. Lines 1 and 2 rhyme, then lines 3 and 4 rhyme.
  - front: What is the message of 'The Spider and the Fly'?
    back: Do not trust people who flatter you, because they may want something from you.
  - front: Why was the stone soup so tasty?
    back: Because each villager added an ingredient. The stone was not magic, and sharing made the soup.
practice:
  - q: "'The wind whispered through the trees.' What is this an example of?"
    options: ["Simile", "Personification", "Rhyme", "Antonym"]
    answer: 1
    explain: The wind is given a human action (whispering), so it is personification.
  - q: Which line is a simile?
    options: ["The moon was a balloon.", "Time crawled.", "She was as light as a feather.", "The fields begged for rain."]
    answer: 2
    explain: A simile compares using 'like' or 'as', as in 'as light as a feather'.
  - q: A group of lines in a poem is called a...
    options: ["chapter", "stanza", "caption", "paragraph heading"]
    answer: 1
    explain: Poems are divided into stanzas.
  - q: Which word completes the sentence? 'This is the ___ cake I have ever tasted.'
    options: ["good", "better", "best", "more good"]
    answer: 2
    explain: "We are comparing it with every cake, so we need the superlative: 'best'."
  - q: Which word has the 'sh' sound spelt 'ci'?
    options: ["mission", "special", "action", "shelf"]
    answer: 1
    explain: "In 'special', the letters 'ci' make the 'sh' sound."
  - q: What is an antonym of 'cruel'?
    options: ["mean", "kind", "angry", "harsh"]
    answer: 1
    explain: "'Kind' is the opposite of 'cruel'."
  - q: A narrative poem...
    options: ["must not rhyme", "tells a story", "is always about nature", "has only one line"]
    answer: 1
    explain: Narrative poems tell a story with characters and events.
  - q: How does the spider persuade the fly to come in?
    options: ["He threatens her", "He flatters her with compliments", "He offers her money", "He tells her a joke"]
    answer: 1
    explain: The spider keeps praising the fly until she forgets her fear.
