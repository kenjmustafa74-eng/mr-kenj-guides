    tip: A narrative poem has a beginning, a climax and an ending, just like a story.
  - part: 3B
    lesson: Lesson 11
    title: "Reading Part 1: Stone Soup"
    pages: "71–72"
    tip: Find the rhyming pattern. Lines that rhyme in pairs are written as 'aabb'.
  - part: 3B
    lesson: Lesson 12
    title: "Language Focus – Vocabulary: Synonyms and antonyms"
    pages: "73"
    tip: Use synonyms to avoid repeating words, and antonyms to show contrast.
  - part: 3B
    lesson: Lesson 13
    title: "Reading Part 2: The Spider and the Fly and Reading Comprehension"
    pages: "74–76"
    tip: Notice every compliment that the spider pays the fly. Why do they work?
  - part: 3B
    lesson: Lesson 14
    title: "Language Focus – Grammar: More about degrees of comparison"
    pages: "77"
    tip: Some words change completely, for example 'good', 'better' and 'best', or 'bad', 'worse' and 'worst'.
  - part: 3B
    lesson: Lesson 15
    title: "Listening: Nature's Treasures"
