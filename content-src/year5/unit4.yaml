id: 4
title: The Workings of Machines
icon: "⚙️"
colour: "#3a6ea5"
sbStart: 82
wbStart: 52
sbPages: "82–107"
wbPages: "52–68"
parts:
  - code: 4A
    title: How Does It Work?
  - code: 4B
    title: Pictures Tell More
overview: >-
  How does a radio turn invisible waves into music and voices? In this unit you will read explanation texts that
  answer questions like this. You will learn how writers use headings, diagrams and flowcharts to make tricky ideas
  clear, and you will write your own explanation of how a machine works.
objectives:
  - Identify the features of explanation texts, such as headings, subheadings, diagrams and the present simple tense.
  - Use infographics, keys, flowcharts and labelled diagrams to understand information.
  - Use countable and uncountable nouns with the right quantifiers, for example 'fewer' and 'less'.
  - Find words quickly in alphabetical lists, such as dictionaries and glossaries.
  - Tell the difference between homophones, homographs and homonyms.
  - Reorder clauses in multi-clause sentences, and use specialised vocabulary in your own explanation.
texts:
  - title: What Makes a Radio Work?
    kind: Information text with explanation
    pages: "85–91"
    summary: >-
      This explanation text tells you about electromagnetic waves, which travel through space, and how they are
      different from sound waves. It explains frequency (visible light has a higher frequency than radio waves)
      and shows how devices such as a remote-controlled car use an antenna to receive signals.
  - title: How Does a Radio Work?
    kind: Information text with explanation
    pages: "98–102"
    summary: >-
      This text follows a message from start to finish. A transmitter turns sound waves into radio waves and sends
      them out. A receiver with an aerial picks them up, turns them back into sound and makes the sound louder, so
      that we can hear it. It also explains the two main kinds of radio broadcasting, AM and FM, using a flowchart and labelled pictures.
vocab:
  - word: explanation text
    meaning: A non-fiction text that explains how or why something works or happens.
    example: The explanation text showed how a radio works.
  - word: transmitter
    meaning: A device that sends out signals, such as radio waves.
    example: The radio station's transmitter sends out the signal.
  - word: receiver
    meaning: A device that picks up signals and changes them into something we can use.
    example: Your radio is a receiver.
  - word: antenna
    meaning: A metal rod or wire that sends or receives radio waves (also called an aerial).
    example: The car's antenna picked up the signal.
  - word: frequency
    meaning: How many times something happens, or how many waves pass a point, in a certain amount of time.
    example: Visible light has a higher frequency than radio waves.
  - word: amplify
    meaning: To make a sound louder.
    example: The speaker amplifies the music.
  - word: infographic
    meaning: A picture, chart or diagram that shows information clearly.
    example: The flowchart is an infographic.
  - word: quantifier
    meaning: A word that tells you how much or how many, such as 'some', 'few', 'little' or 'enough'.
    example: There was less snow and fewer people this year.
  - word: homophone
    meaning: A word that sounds the same as another word but has a different spelling and meaning.
    example: "'Right' and 'write' are homophones."
  - word: glossary
    meaning: An alphabetical list of special words and their meanings, usually at the back of a book.
    example: I checked 'frequency' in the glossary.
