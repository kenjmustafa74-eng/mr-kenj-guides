cards:
  - front: Name four features of an explanation text.
    back: For example, a heading, subheadings, ordered steps, labelled diagrams, the present simple tense and connectives.
  - front: What does a transmitter do?
    back: It changes sound waves into radio waves and sends them out.
  - front: What does a receiver do?
    back: It picks up radio waves with an aerial, changes them back into sound and makes the sound louder.
  - front: "'Fewer' or 'less'?"
    back: Use 'fewer' for things you can count (fewer people) and 'less' for things you cannot count (less snow).
  - front: What are AM and FM?
    back: Two ways of sending radio signals. FM uses a broader range of frequencies than AM.
  - front: What is the difference between a homophone and a homograph?
    back: Homophones sound the same but are spelt differently (right and write). Homographs are spelt the same but have different meanings (lead and lead).
practice:
  - q: Which tense do explanation texts usually use?
    options: ["Past tense", "Present simple tense", "Future tense", "Past perfect tense"]
    answer: 1
    explain: Explanations describe how things work now, so they use the present simple tense.
  - q: Choose the correct sentence.
    options: ["There were less people at the show.", "There were fewer people at the show.", "There were fewest people at the show.", "There were lesser people at the show."]
    answer: 1
    explain: People can be counted, so we use 'fewer'.
  - q: Which part of a radio system changes sound waves into radio waves?
    options: ["The speaker", "The receiver", "The transmitter", "The battery"]
    answer: 2
    explain: The transmitter changes the sound into radio waves and sends them out.
  - q: Which word comes first in alphabetical order?
    options: ["circus", "circle", "circuit", "circular"]
    answer: 1
    explain: "circl- comes before circu-, so 'circle' comes first."
  - q: Which pair are homophones?
    options: ["light (not heavy) and light (bright)", "write and right", "big and large", "hot and cold"]
    answer: 1
    explain: "'Write' and 'right' sound the same but have different spellings and meanings."
  - q: What is a flowchart?
    options: ["A diagram showing the steps of a process in order", "A list of words with meanings", "A type of poem", "A photograph with a caption"]
    answer: 0
    explain: A flowchart uses boxes and arrows to show steps in order.
  - q: Which sentence is punctuated correctly?
    options: ["As it was raining we listened to the radio.", "As it was raining, we listened to the radio.", "As, it was raining we listened to the radio.", "As it was raining we, listened to the radio."]
    answer: 1
    explain: When the dependent clause comes first, put a comma after it.
  - q: "What does 'amplify' mean?"
    options: ["To make quieter", "To make louder", "To switch off", "To record"]
    answer: 1
    explain: To amplify a sound is to make it louder.
